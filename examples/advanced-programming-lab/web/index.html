<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lab formulir laporan fiktif</title><style>body{font:17px system-ui;max-width:850px;margin:40px auto;padding:24px;background:#f5f7f6;color:#243b36}main{background:white;padding:30px;border-radius:18px}label{display:block;margin-top:18px}input,select,button{font:inherit;padding:12px;border:1px solid #aabbb4;border-radius:7px}input{width:min(90%,400px)}button{margin-top:18px;background:#285c4b;color:white;cursor:pointer}a{color:#285c4b}li{padding:8px}#pesan{min-height:1.6em}nav{margin-bottom:24px}.note{background:#edf2ef;padding:14px;border-radius:8px}</style></head>
<body data-mode="simulasi"><main><nav><a href="#formulir">Formulir</a> · <a href="#daftar">Daftar laporan</a></nav><h1>Lab laporan layanan</h1><p class="note" id="mode">Demo data fiktif.</p><section id="formulir"><h2>Tambah observasi</h2><form id="form"><label for="layanan">Nama layanan</label><input id="layanan" name="layanan" required maxlength="40" autocomplete="off"><label for="hasil">Hasil</label><select id="hasil" name="hasil"><option value="ok">ok</option><option value="timeout">timeout</option><option value="refused">refused</option></select><br><button type="submit">Simpan observasi</button></form><p id="pesan" role="status" aria-live="polite"></p></section><section id="daftar"><h2>Daftar laporan</h2><button type="button" id="muat">Muat laporan</button><ul id="list"></ul></section></main>
<script>
const simulated=document.body.dataset.mode==='simulasi';let rows=[];
document.getElementById('mode').textContent=simulated?'Mode simulasi: data hanya di memori tab dan hilang saat dimuat ulang. Tidak mengirim data ke server.':'Mode API lab lokal: server menyimpan data sementara selama proses berjalan.';
async function request(method,data){
 if(simulated){if(method==='POST'){if(rows.length>=20)throw Error('Batas');rows.push({id:rows.length+1,...data});}return rows.slice();}
 const response=await fetch('/api/observasi',{method,headers:{'Content-Type':'application/json'},...(data?{body:JSON.stringify(data)}:{})});
 if(!response.ok)throw Error('HTTP '+response.status);return response.json();
}
async function render(){const data=await request('GET');const list=document.getElementById('list');list.replaceChildren();for(const row of data){const li=document.createElement('li');li.textContent=row.layanan+' · '+row.hasil;list.append(li);}}
document.getElementById('form').addEventListener('submit',async event=>{event.preventDefault();const input=document.getElementById('layanan');const name=input.value.trim();const message=document.getElementById('pesan');if(!/^[A-Za-z0-9 _-]{1,40}$/.test(name)){message.textContent='Nama layanan wajib 1–40 karakter huruf, angka, spasi, _ atau -.';return;}const button=event.submitter;button.disabled=true;try{await request('POST',{layanan:name,hasil:document.getElementById('hasil').value});await render();input.value='';message.textContent='Data tersimpan.';}catch(error){message.textContent='Belum dapat menyimpan. Periksa layanan lalu coba lagi.';}finally{button.disabled=false;}});
document.getElementById('muat').addEventListener('click',()=>render().catch(()=>{document.getElementById('pesan').textContent='Belum dapat memuat laporan.';}));
</script></body></html>
