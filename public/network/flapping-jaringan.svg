<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Flapping: cocokkan waktu perubahan link, OSPF, dan rute</title><desc id="desc">Tabel ilustrasi empat waktu: kondisi stabil, link turun, pemulihan adjacency, lalu stabil kembali. Urutan ini disederhanakan dan bukan hasil pengamatan router nyata.</desc><rect width="800" height="420" rx="18" fill="#f0f5ef"/><g font-family="Arial,sans-serif" fill="#193a32"><text x="30" y="43" font-size="25" font-weight="700">Yang berubah apa, dan kapan?</text><text x="30" y="73" font-size="16">Contoh pola yang disederhanakan, bukan log router nyata.</text><rect x="30" y="101" width="740" height="42" rx="6" fill="#dbe8dd"/><g font-size="17" font-weight="700"><text x="45" y="128">Waktu</text><text x="165" y="128">Link</text><text x="350" y="128">OSPF adjacency</text><text x="575" y="128">Rute / jalur</text></g><g font-size="18"><rect x="30" y="150" width="740" height="44" rx="6" fill="#fff"/><text x="45" y="178">t0</text><text x="165" y="178">Up</text><text x="350" y="178">Full</text><text x="575" y="178">Stabil</text><rect x="30" y="200" width="740" height="44" rx="6" fill="#fff0e8"/><text x="45" y="228">t1</text><text x="165" y="228">Down</text><text x="350" y="228">Terputus</text><text x="575" y="228">Berubah</text><rect x="30" y="250" width="740" height="44" rx="6" fill="#fff8e8"/><text x="45" y="278">t2</text><text x="165" y="278">Up lagi</text><text x="350" y="278">Dibangun ulang</text><text x="575" y="278">Pemulihan</text><rect x="30" y="300" width="740" height="44" rx="6" fill="#fff"/><text x="45" y="328">t3</text><text x="165" y="328">Up</text><text x="350" y="328">Full</text><text x="575" y="328">Stabil lagi</text></g><text x="30" y="376" font-size="16">OSPF juga dapat putus ketika link lokal tetap Up.</text><text x="30" y="401" font-size="16">Selisih counter + log kedua ujung lebih berguna daripada satu ikon hijau.</text></g></svg>
