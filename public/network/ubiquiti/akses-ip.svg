<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-labelledby="title desc"><title id="title">Pindahkan radio, sesuaikan laptop</title><desc id="desc">Contoh hanya untuk unit yang terverifikasi memakai 192.168.1.20/24 pada akses awal. Setelah radio disimpan sebagai 192.168.50.2/24, laptop dipindahkan ke 192.168.50.10/24 dan browser membuka alamat baru.</desc><rect width="600" height="480" fill="white"/><g font-family="Arial, sans-serif" text-anchor="middle" fill="#193c33"><text x="300" y="38" font-size="23" font-weight="700">Dua tahap akses radio A</text><text x="300" y="75" font-size="17">Contoh alamat awal yang sudah diverifikasi</text><rect x="30" y="99" width="230" height="94" rx="12" fill="#edf5ef" stroke="#b8cec0"/><text x="145" y="132" font-size="21" font-weight="700">Laptop</text><text x="145" y="167" font-size="20">192.168.1.10/24</text><path d="M260 146 H340" stroke="#2e7968" stroke-width="3"/><rect x="340" y="99" width="230" height="94" rx="12" fill="#edf5ef" stroke="#b8cec0"/><text x="455" y="132" font-size="21" font-weight="700">Radio A</text><text x="455" y="167" font-size="20">192.168.1.20/24</text><text x="300" y="233" font-size="18" font-weight="700">Simpan IP radio, lalu ubah subnet laptop</text><path d="M300 248 V278" stroke="#2e7968" stroke-width="3"/><rect x="30" y="294" width="230" height="94" rx="12" fill="#f7f1e6" stroke="#d7c6af"/><text x="145" y="327" font-size="21" font-weight="700">Laptop</text><text x="145" y="362" font-size="20">192.168.50.10/24</text><path d="M260 341 H340" stroke="#2e7968" stroke-width="3"/><rect x="340" y="294" width="230" height="94" rx="12" fill="#f7f1e6" stroke="#d7c6af"/><text x="455" y="327" font-size="21" font-weight="700">Radio A</text><text x="455" y="362" font-size="20">192.168.50.2/24</text><text x="300" y="427" font-size="19">Buka kembali alamat radio yang baru</text><text x="300" y="457" font-size="17">Radio B disiapkan terpisah pada .50.3/24</text></g></svg>
