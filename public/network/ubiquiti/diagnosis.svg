<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-labelledby="title desc"><title id="title">Pisahkan bidang pemeriksaan</title><desc id="desc">Periksa daya dan kabel, asosiasi radio, IP dan VLAN, lalu layanan sesuai bukti.</desc><rect width="600" height="480" fill="#fff"/><g font-family="Arial, sans-serif"><text x="300" y="38" text-anchor="middle" font-size="24" fill="#193c33" font-weight="700">Pisahkan bidang pemeriksaan</text><rect x="35" y="80" width="250" height="105" rx="12" fill="#edf5ef" stroke="#b8cec0"/><text x="160.0" y="112" text-anchor="middle" font-size="21" fill="#193c33" font-weight="700">1. Daya / Ethernet</text><text x="160.0" y="140" text-anchor="middle" font-size="17" fill="#193c33" font-weight="500">LED, uptime, link port</text><rect x="315" y="80" width="250" height="105" rx="12" fill="#edf5ef" stroke="#b8cec0"/><text x="440.0" y="112" text-anchor="middle" font-size="21" fill="#193c33" font-weight="700">2. Asosiasi radio</text><text x="440.0" y="140" text-anchor="middle" font-size="17" fill="#193c33" font-weight="500">Pasangan, RF, log</text><rect x="35" y="225" width="250" height="105" rx="12" fill="#edf5ef" stroke="#b8cec0"/><text x="160.0" y="257" text-anchor="middle" font-size="21" fill="#193c33" font-weight="700">3. IP / VLAN</text><text x="160.0" y="285" text-anchor="middle" font-size="17" fill="#193c33" font-weight="500">Alamat, bridge, rute</text><rect x="315" y="225" width="250" height="105" rx="12" fill="#edf5ef" stroke="#b8cec0"/><text x="440.0" y="257" text-anchor="middle" font-size="21" fill="#193c33" font-weight="700">4. Layanan</text><text x="440.0" y="285" text-anchor="middle" font-size="17" fill="#193c33" font-weight="500">DNS, aplikasi, tujuan</text><text x="300" y="389" text-anchor="middle" font-size="21" fill="#193c33" font-weight="500">Alarm monitoring perlu divalidasi</text><text x="300" y="426" text-anchor="middle" font-size="19" fill="#193c33" font-weight="500">Catat waktu dan titik uji</text><text x="300" y="454" text-anchor="middle" font-size="18" fill="#193c33" font-weight="500">sebelum menentukan tindakan berikutnya</text></g></svg>
