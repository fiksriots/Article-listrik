<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-labelledby="title desc"><title id="title">Lebar kanal dan interferensi</title><desc id="desc">Area gangguan yang sama dapat tumpang tindih dengan kanal lebar; diagram bukan hasil pengukuran.</desc><rect width="600" height="480" fill="#fff"/><g font-family="Arial, sans-serif"><text x="300" y="38" text-anchor="middle" font-size="24" fill="#193c33" font-weight="700">Lebar kanal dan interferensi</text><text x="300" y="87" text-anchor="middle" font-size="17" fill="#193c33" font-weight="500">Ilustrasi konsep; bukan frekuensi nyata</text><path d="M60 165 L540 165" stroke="#2e7968" stroke-width="3" fill="none"/><path d="M60 300 L540 300" stroke="#2e7968" stroke-width="3" fill="none"/><rect x="350" y="105" width="80" height="238" rx="6" fill="#f8dcca"/><text x="390" y="130" text-anchor="middle" font-size="16" fill="#193c33" font-weight="500">Gangguan</text><rect x="100" y="140" width="160" height="55" rx="12" fill="#edf5ef" stroke="#b8cec0"/><text x="180.0" y="172" text-anchor="middle" font-size="21" fill="#193c33" font-weight="700">Kanal sempit</text><rect x="100" y="275" width="330" height="55" rx="12" fill="#edf5ef" stroke="#b8cec0"/><text x="265.0" y="307" text-anchor="middle" font-size="21" fill="#193c33" font-weight="700">Kanal lebar</text><text x="300" y="390" text-anchor="middle" font-size="18" fill="#193c33" font-weight="500">Lebih lebar memakai lebih banyak spektrum</text><text x="300" y="426" text-anchor="middle" font-size="18" fill="#193c33" font-weight="500">Ukur throughput, retry, dan latency</text><text x="300" y="454" text-anchor="middle" font-size="18" fill="#193c33" font-weight="500">sebelum memilih pengaturan</text></g></svg>
