<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-labelledby="title desc"><title id="title">LOS dan ruang Fresnel</title><desc id="desc">Garis pandang harus diperiksa bersama ruang di sekitarnya; gambar tidak berskala.</desc><rect width="600" height="480" fill="#fff"/><g font-family="Arial, sans-serif"><text x="300" y="38" text-anchor="middle" font-size="24" fill="#193c33" font-weight="700">LOS dan ruang Fresnel</text><ellipse cx="300" cy="215" rx="237" ry="92" fill="#edf5ef" stroke="#60a38c" stroke-width="2" stroke-dasharray="8 5"/><path d="M55 215 L545 215" stroke="#2e7968" stroke-width="3" fill="none"/><text x="300" y="110" text-anchor="middle" font-size="21" fill="#193c33" font-weight="500">Zona Fresnel pertama</text><text x="300" y="202" text-anchor="middle" font-size="18" fill="#193c33" font-weight="500">Garis pandang / LOS</text><rect x="20" y="300" width="120" height="78" rx="12" fill="#edf5ef" stroke="#b8cec0"/><text x="80.0" y="332" text-anchor="middle" font-size="21" fill="#193c33" font-weight="700">Titik A</text><text x="80.0" y="360" text-anchor="middle" font-size="17" fill="#193c33" font-weight="500">Antena</text><rect x="460" y="300" width="120" height="78" rx="12" fill="#edf5ef" stroke="#b8cec0"/><text x="520.0" y="332" text-anchor="middle" font-size="21" fill="#193c33" font-weight="700">Titik B</text><text x="520.0" y="360" text-anchor="middle" font-size="17" fill="#193c33" font-weight="500">Antena</text><path d="M80 300 L55 215" stroke="#2e7968" stroke-width="3" fill="none"/><path d="M520 300 L545 215" stroke="#2e7968" stroke-width="3" fill="none"/><path d="M300 361 L300 285" stroke="#8d6950" stroke-width="12"/><path d="M255 315 L300 247 L345 315Z" fill="#79a37a"/><text x="300" y="407" text-anchor="middle" font-size="20" fill="#193c33" font-weight="500">Pohon dapat masuk zona</text><text x="300" y="436" text-anchor="middle" font-size="18" fill="#193c33" font-weight="500">meskipun garis LOS masih terlihat</text></g></svg>
