<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" role="img" aria-labelledby="title desc"><title id="title">Uji lintas link dengan dua host</title><desc id="desc">iperf3 berjalan pada komputer di masing-masing ujung; pengujian mencakup kabel dan radio.</desc><rect width="600" height="480" fill="#fff"/><g font-family="Arial, sans-serif"><text x="300" y="38" text-anchor="middle" font-size="24" fill="#193c33" font-weight="700">Uji lintas link dengan dua host</text><rect x="30" y="78" width="220" height="80" rx="12" fill="#edf5ef" stroke="#b8cec0"/><text x="140.0" y="110" text-anchor="middle" font-size="21" fill="#193c33" font-weight="700">PC A / client</text><text x="140.0" y="138" text-anchor="middle" font-size="17" fill="#193c33" font-weight="500">192.168.50.10</text><rect x="350" y="78" width="220" height="80" rx="12" fill="#edf5ef" stroke="#b8cec0"/><text x="460.0" y="110" text-anchor="middle" font-size="21" fill="#193c33" font-weight="700">PC B / server</text><text x="460.0" y="138" text-anchor="middle" font-size="17" fill="#193c33" font-weight="500">192.168.50.20</text><path d="M140 158 L140 214" stroke="#2e7968" stroke-width="3" fill="none"/><path d="M460 158 L460 214" stroke="#2e7968" stroke-width="3" fill="none"/><rect x="30" y="214" width="220" height="80" rx="12" fill="#edf5ef" stroke="#b8cec0"/><text x="140.0" y="246" text-anchor="middle" font-size="21" fill="#193c33" font-weight="700">Radio A</text><text x="140.0" y="274" text-anchor="middle" font-size="17" fill="#193c33" font-weight="500">Ethernet sisi A</text><rect x="350" y="214" width="220" height="80" rx="12" fill="#edf5ef" stroke="#b8cec0"/><text x="460.0" y="246" text-anchor="middle" font-size="21" fill="#193c33" font-weight="700">Radio B</text><text x="460.0" y="274" text-anchor="middle" font-size="17" fill="#193c33" font-weight="500">Ethernet sisi B</text><path d="M250 255 L350 255" stroke="#2e7968" stroke-width="3" fill="none" stroke-dasharray="9 7"/><text x="300" y="342" text-anchor="middle" font-size="22" fill="#193c33" font-weight="500">Uji maju: A → B</text><text x="300" y="382" text-anchor="middle" font-size="22" fill="#193c33" font-weight="500">Uji balik: B → A dengan -R</text><text x="300" y="440" text-anchor="middle" font-size="18" fill="#193c33" font-weight="500">Catat arah, durasi, beban, dan hasil receiver</text></g></svg>
