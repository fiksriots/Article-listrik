<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420"><title>LACP: agregasi link berbeda dari dua ISP</title><rect width="800" height="420" rx="18" fill="#edf4ef"/><text x="400" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#193a32">LACP: agregasi link berbeda dari dua ISP</text><rect x="75" y="150" width="145" height="108" rx="10" fill="#fff" stroke="#b5cdbb"/><rect x="580" y="150" width="145" height="108" rx="10" fill="#fff" stroke="#b5cdbb"/><text x="147" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#193a32">Switch A</text><text x="652" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#193a32">Switch B</text><path d="M220 174L580 174" fill="none" stroke="#236b62" stroke-width="3" stroke-dasharray=""/><text x="400" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#193a32">Anggota 1</text><path d="M220 232L580 232" fill="none" stroke="#236b62" stroke-width="3" stroke-dasharray=""/><text x="400" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#193a32">Anggota 2</text><text x="400" y="111" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#193a32">Satu grup LACP yang dikonfigurasi di kedua ujung</text><text x="400" y="303" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#193a32">Beberapa aliran dapat dibagi menurut hash</text><text x="400" y="333" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#193a32">Satu aliran tidak otomatis memakai jumlah kapasitas semua link</text><text x="400" y="390" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#63786b">Ilustrasi edukasi • ukuran visual disederhanakan untuk menjelaskan konsep</text></svg>