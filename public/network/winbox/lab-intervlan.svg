<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img" aria-labelledby="title desc"><title id="title">VLAN dan kebijakan routed</title><desc id="desc">Gateway VLAN tidak otomatis menjadi izin semua trafik.</desc><rect width="900" height="640" rx="20" fill="#f4f7f2"/><g font-family="Arial,sans-serif" fill="#193a32"><text x="38" y="45" font-size="25" font-weight="700">VLAN dan kebijakan routed</text><text x="38" y="75" font-size="17">Gateway VLAN tidak otomatis menjadi izin semua trafik.</text></g><path d="M450 180 L450 255" stroke="#77938a" stroke-width="3" fill="none"/><rect x="301.5" y="204" width="297" height="26" rx="5" fill="#f4f7f2"/><text x="450" y="222" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#193a32">NAT untuk sumber yang diizinkan</text><path d="M365 345 L155 435" stroke="#77938a" stroke-width="3" fill="none"/><path d="M450 345 L450 435" stroke="#77938a" stroke-width="3" fill="none"/><path d="M535 345 L745 435" stroke="#77938a" stroke-width="3" fill="none"/><rect x="350" y="110" width="200" height="70" rx="12" fill="#ffffff" stroke="#c1d5c8"/><text x="450.0" y="152.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#193a32">Internet / WAN</text><rect x="320" y="255" width="260" height="90" rx="12" fill="#236b62" stroke="#c1d5c8"/><text x="450.0" y="294.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">R1: gateway + firewall</text><text x="450.0" y="320.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#ffffff">10.1 / 20.1 / 30.1</text><rect x="40" y="435" width="230" height="100" rx="12" fill="#ffffff" stroke="#c1d5c8"/><text x="155.0" y="466.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#193a32">Staf VLAN 10</text><text x="155.0" y="492.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#193a32">192.168.10.0/24</text><text x="155.0" y="518.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#193a32">Internet + NVR TCP 80</text><rect x="335" y="435" width="230" height="100" rx="12" fill="#ffffff" stroke="#c1d5c8"/><text x="450.0" y="466.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#193a32">Tamu VLAN 20</text><text x="450.0" y="492.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#193a32">192.168.20.0/24</text><text x="450.0" y="518.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#193a32">Internet saja</text><rect x="630" y="435" width="230" height="100" rx="12" fill="#ffffff" stroke="#c1d5c8"/><text x="745.0" y="466.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#193a32">CCTV VLAN 30</text><text x="745.0" y="492.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#193a32">192.168.30.0/24</text><text x="745.0" y="518.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#193a32">NVR .30.10; WAN ditolak</text><text x="38" y="586" font-family="Arial,sans-serif" font-size="17" fill="#193a32">Input: akses ke router. Forward: akses melewati router.</text><text x="38" y="610" font-family="Arial,sans-serif" font-size="17" fill="#193a32">Izin staf ke NVR dibatasi interface, sumber, tujuan, dan layanan.</text></svg>