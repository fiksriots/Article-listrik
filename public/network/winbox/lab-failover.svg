<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img" aria-labelledby="title desc"><title id="title">Recursive failover dua ISP</title><desc id="desc">Lab tersendiri: admin melalui ether3; ether2 digunakan untuk WAN2.</desc><rect width="900" height="640" rx="20" fill="#f4f7f2"/><g font-family="Arial,sans-serif" fill="#193a32"><text x="38" y="45" font-size="25" font-weight="700">Recursive failover dua ISP</text><text x="38" y="75" font-size="17">Lab tersendiri: admin melalui ether3; ether2 digunakan untuk WAN2.</text></g><path d="M210 210 L370 315" stroke="#77938a" stroke-width="3" fill="none"/><rect x="201.0" y="252" width="108" height="26" rx="5" fill="#f4f7f2"/><text x="255" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#193a32">ISP1 utama</text><path d="M690 210 L530 315" stroke="#77938a" stroke-width="3" fill="none"/><rect x="592.5" y="252" width="135" height="26" rx="5" fill="#f4f7f2"/><text x="660" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#193a32">ISP2 cadangan</text><path d="M450 415 L450 485" stroke="#77938a" stroke-width="3" fill="none"/><rect x="60" y="110" width="300" height="100" rx="12" fill="#ffffff" stroke="#c1d5c8"/><text x="210.0" y="141.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#193a32">Probe 8.8.8.8/32</text><text x="210.0" y="167.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#193a32">via 192.168.1.1 / ISP1</text><text x="210.0" y="193.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#193a32">WAN1 ether1: 192.168.1.2</text><rect x="540" y="110" width="300" height="100" rx="12" fill="#ffffff" stroke="#c1d5c8"/><text x="690.0" y="141.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#193a32">Probe 1.1.1.1/32</text><text x="690.0" y="167.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#193a32">via 192.168.2.1 / ISP2</text><text x="690.0" y="193.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#193a32">WAN2 ether2: 192.168.2.2</text><rect x="270" y="315" width="360" height="100" rx="12" fill="#236b62" stroke="#c1d5c8"/><text x="450.0" y="346.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">R1 / routing table main</text><text x="450.0" y="372.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#ffffff">Default utama distance 1</text><text x="450.0" y="398.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#ffffff">Default cadangan distance 2</text><rect x="270" y="485" width="360" height="60" rx="12" fill="#ffffff" stroke="#c1d5c8"/><text x="450.0" y="522.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#193a32">LAN 192.168.88.0/24</text><text x="38" y="586" font-family="Arial,sans-serif" font-size="17" fill="#193a32">Probe /32 dipasangkan ke gateway ISP masing-masing.</text><text x="38" y="610" font-family="Arial,sans-serif" font-size="17" fill="#193a32">Route aktif belum membuktikan DNS dan HTTPS klien berhasil.</text></svg>