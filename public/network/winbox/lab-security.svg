595" y="125" width="260" height="90" rx="12" fill="#ffffff" stroke="#c1d5c8"/><text x="725.0" y="164.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#193a32">Peer VPN terdaftar</text><text x="725.0" y="190.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#193a32">10.77.77.2/32</text><rect x="300" y="300" width="300" height="105" rx="12" fill="#236b62" stroke="#c1d5c8"/><text x="450.0" y="333.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">Router / layanan admin</text><text x="450.0" y="359.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#ffffff">Akun + izin source</text><text x="450.0" y="385.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#ffffff">Input filter + Services</text><rect x="45" y="465" width="260" height="80" rx="12" fill="#ffffff" stroke="#c1d5c8"/><text x="175.0" y="499.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#193a32">VLAN tamu</text><text x="175.0" y="525.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#193a32">Winbox ditolak</text><rect x="595" y="465" width="260" height="80" rx="12" fill="#ffffff" stroke="#c1d5c8"/><text x="725.0" y="499.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#193a32">Internet / WAN</text><text x="725.0" y="525.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#193a32">Winbox langsung ditolak</text><text x="38" y="586" font-family="Arial,sans-serif" font-size="17" fill="#193a32">MAC Winbox hanya pada interface pengelolaan yang tepercaya.</text><text x="38" y="610" font-family="Arial,sans-serif" font-size="17" fill="#193a32">Discovery dimatikan tidak sama dengan mematikan akses IP.</text></svg>