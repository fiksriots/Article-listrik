<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img" aria-labelledby="title desc"><title id="title">Proyek kantor kecil: pemetaan final</title><desc id="desc">Pada proyek ini WAN2 = ether3; ether2 tetap jalur admin.</desc><rect width="900" height="640" rx="20" fill="#f4f7f2"/><g font-family="Arial,sans-serif" fill="#193a32"><text x="38" y="45" font-size="25" font-weight="700">Proyek kantor kecil: pemetaan final</text><text x="38" y="75" font-size="17">Pada proyek ini WAN2 = ether3; ether2 tetap jalur admin.</text></g><path d="M170 180 L365 235" stroke="#77938a" stroke-width="3" fill="none"/><path d="M730 180 L535 235" stroke="#77938a" stroke-width="3" fill="none"/><path d="M260 285 L320 285" stroke="#77938a" stroke-width="3" fill="none"/><path d="M450 330 L450 395" stroke="#77938a" stroke-width="3" fill="none"/><rect x="324.0" y="352" width="252" height="26" rx="5" fill="#f4f7f2"/><text x="450" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#193a32">R1 ether5: tagged 10/20/30</text><path d="M355 460 L155 505" stroke="#77938a" stroke-width="3" fill="none"/><path d="M450 460 L450 505" stroke="#77938a" stroke-width="3" fill="none"/><path d="M545 460 L745 505" stroke="#77938a" stroke-width="3" fill="none"/><rect x="50" y="105" width="240" height="75" rx="12" fill="#ffffff" stroke="#c1d5c8"/><text x="170.0" y="136.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#193a32">ISP1 / gateway .1.1</text><text x="170.0" y="162.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#193a32">R1 ether1 / .1.2</text><rect x="610" y="105" width="240" height="75" rx="12" fill="#ffffff" stroke="#c1d5c8"/><text x="730.0" y="136.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#193a32">ISP2 / gateway .2.1</text><text x="730.0" y="162.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#193a32">R1 ether3 / .2.2</text><rect x="320" y="235" width="260" height="95" rx="12" fill="#236b62" stroke="#c1d5c8"/><text x="450.0" y="263.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">R1 / gateway kantor</text><text x="450.0" y="289.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#ffffff">VLAN + firewall + PCQ</text><text x="450.0" y="315.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#ffffff">VPN admin terbatas</text><rect x="45" y="240" width="215" height="90" rx="12" fill="#ffffff" stroke="#c1d5c8"/><text x="152.5" y="279.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#193a32">Admin lokal</text><text x="152.5" y="305.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#193a32">ether2 / .88.1</text><rect x="320" y="395" width="260" height="65" rx="12" fill="#236b62" stroke="#c1d5c8"/><text x="450.0" y="434.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">S1 / trunk ether1</text><rect x="30" y="505" width="250" height="55" rx="12" fill="#ffffff" stroke="#c1d5c8"/><text x="155.0" y="539.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#193a32">Staf / VLAN 10</text><rect x="325" y="505" width="250" height="55" rx="12" fill="#ffffff" stroke="#c1d5c8"/><text x="450.0" y="539.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#193a32">Tamu / VLAN 20</text><rect x="620" y="505" width="250" height="55" rx="12" fill="#ffffff" stroke="#c1d5c8"/><text x="745.0" y="539.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#193a32">CCTV / VLAN 30</text><text x="38" y="586" font-family="Arial,sans-serif" font-size="17" fill="#193a32">Tamu PCQ