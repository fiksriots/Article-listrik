<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img" aria-labelledby="title desc"><title id="title">WireGuard untuk admin Winbox</title><desc id="desc">Endpoint UDP berbeda dari alamat IP di dalam tunnel.</desc><rect width="900" height="640" rx="20" fill="#f4f7f2"/><g font-family="Arial,sans-serif" fill="#193a32"><text x="38" y="45" font-size="25" font-weight="700">WireGuard untuk admin Winbox</text><text x="38" y="75" font-size="17">Endpoint UDP berbeda dari alamat IP di dalam tunnel.</text></g><path d="M345 175 L520 175" stroke="#77938a" stroke-width="3" fill="none"/><rect x="380.5" y="147" width="99" height="26" rx="5" fill="#f4f7f2"/><text x="430" y="165" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#193a32">handshake</text><path d="M680 225 L680 340" stroke="#77938a" stroke-width="3" fill="none"/><rect x="644.0" y="272" width="72" height="26" rx="5" fill="#f4f7f2"/><text x="680" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#193a32">tunnel</text><path d="M520 395 L345 395" stroke="#77938a" stroke-width="3" fill="none"/><rect x="55" y="125" width="290" height="100" rx="12" fill="#ffffff" stroke="#c1d5c8"/><text x="200.0" y="156.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#193a32">Laptop jaringan luar</text><text x="200.0" y="182.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#193a32">VPN 10.77.77.2/32</text><text x="200.0" y="208.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#193a32">Menyimpan private key sendiri</text><rect x="520" y="125" width="320" height="100" rx="12" fill="#ffffff" stroke="#c1d5c8"/><text x="680.0" y="156.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#193a32">Endpoint publik lab</text><text x="680.0" y="182.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#193a32">UDP 13231</text><text x="680.0" y="208.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#193a32">WAN/modem menuju R1</text><rect x="520" y="340" width="320" height="105" rx="12" fill="#236b62" stroke="#c1d5c8"/><text x="680.0" y="373.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">R1 / wg-lab</text><text x="680.0" y="399.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#ffffff">VPN 10.77.77.1/24</text><text x="680.0" y="425.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#ffffff">Peer: public key laptop</text><rect x="55" y="340" width="290" height="105" rx="12" fill="#ffffff" stroke="#c1d5c8"/><text x="200.0" y="373.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#193a32">Winbox ke 10.77.77.1</text><text x="200.0" y="399.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#193a32">TCP 8291 melalui VPN</text><text x="200.0" y="425.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#193a32">Diizinkan dari peer /32</text><text x="38" y="586" font-family="Arial,sans-serif" font-size="17" fill="#193a32">AllowedIPs laptop awal: hanya 10.77.77.1/32.</text><text x="38" y="610" font-family="Arial,sans-serif" font-size="17" fill="#193a32">CGNAT memerlukan rancangan endpoint yang dapat dijangkau.</text></svg>