<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">IPv6: alamat, gateway, dan DNS punya peran berbeda</title><desc id="desc">ISP mendelegasikan prefix ke router. Router mengumumkan RA pada LAN. Host menggunakan konfigurasi sesuai dukungan, lalu memeriksa route dan DNS.</desc><rect width="800" height="420" rx="18" fill="#edf4ef"/><g font-family="Arial,sans-serif" fill="#16382c"><text x="32" y="42" font-size="25" font-weight="bold">IPv6: alamat, gateway, dan DNS punya peran berbeda</text><rect x="28" y="70" width="744" height="80" rx="12" fill="white" stroke="#adc4b7"/><text x="46" y="95" font-size="17" font-weight="bold">01 · ISP → router pelanggan</text><text x="46" y="120" font-size="20" font-family="monospace">PD: 2001:db8:1234:ab00::/56</text><text x="46" y="140" font-size="14">Prefix Delegation memberikan satu blok untuk dibagi ke beberapa LAN.</text><rect x="28" y="165" width="744" height="80" rx="12" fill="white" stroke="#adc4b7"/><text x="46" y="190" font-size="17" font-weight="bold">02 · Router → LAN staf</text><text x="46" y="215" font-size="20" font-family="monospace">RA: prefix 2001:db8:1234:ab10::/64</text><text x="46" y="235" font-size="14">RA mengumumkan router dan prefix; bukan DHCPv4 dengan nama baru.</text><rect x="28" y="260" width="744" height="80" rx="12" fill="white" stroke="#adc4b7"/><text x="46" y="285" font-size="17" font-weight="bold">03 · Host → jaringan tujuan</text><text x="46" y="310" font-size="20" font-family="monospace">SLAAC / DHCPv6 + default route + DNS</text><text x="46" y="330" font-size="14">Alamat tersedia belum membuktikan gateway, jalur balik, dan layanan sehat.</text><text x="32" y="390" font-size="14">Contoh dokumentasi / model konsep; bukan alokasi internet nyata.</text></g></svg>