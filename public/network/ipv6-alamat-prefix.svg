<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" role="img" aria-labelledby="title desc"><title id="title">Membaca IPv6: dari panjang menjadi ringkas</title><desc id="desc">Alamat lengkap, nol depan dihapus, lalu kelompok nol diringkas. Prefix /64 adalah empat kelompok pertama.</desc><rect width="800" height="420" rx="18" fill="#edf4ef"/><g font-family="Arial,sans-serif" fill="#16382c"><text x="32" y="42" font-size="25" font-weight="bold">Membaca IPv6: dari panjang menjadi ringkas</text><rect x="28" y="70" width="744" height="80" rx="12" fill="white" stroke="#adc4b7"/><text x="46" y="95" font-size="17" font-weight="bold">01 · Bentuk lengkap: delapan kelompok</text><text x="46" y="120" font-size="20" font-family="monospace">2001:0db8:1234:0010:0000:0000:0000:0025</text><text x="46" y="140" font-size="14">Satu kelompok = 16 bit. Delapan kelompok = 128 bit.</text><rect x="28" y="165" width="744" height="80" rx="12" fill="white" stroke="#adc4b7"/><text x="46" y="190" font-size="17" font-weight="bold">02 · Buang nol di depan kelompok</text><text x="46" y="215" font-size="20" font-family="monospace">2001:db8:1234:10:0:0:0:25</text><text x="46" y="235" font-size="14">0010 menjadi 10. Nilai 1000 tetap 1000.</text><rect x="28" y="260" width="744" height="80" rx="12" fill="white" stroke="#adc4b7"/><text x="46" y="285" font-size="17" font-weight="bold">03 · Ringkas tiga kelompok nol</text><text x="46" y="310" font-size="20" font-family="monospace">2001:db8:1234:10::25/64</text><text x="46" y="330" font-size="14">Network /64: 2001:db8:1234:10::/64. Tanda :: hanya sekali.</text><text x="32" y="390" font-size="14">Contoh dokumentasi / model konsep; bukan alokasi internet nyata.</text></g></svg>