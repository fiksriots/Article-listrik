="155" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#193a32">0010</text><text x="400" y="218" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" fill="#193a32">2001:db8::10</text><text x="215" y="267" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#193a32">/64 = 64 bit prefix</text><text x="580" y="267" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#193a32">64 bit sisanya</text><text x="400" y="321" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#193a32">Nol di depan dihilangkan; satu rangkaian nol dapat menjadi ::</text><text x="400" y="348" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#193a32">2001:db8::/32 adalah ruang dokumentasi, bukan alokasi internet nyata</text><text x="400" y="390" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#63786b">Ilustrasi edukasi • ukuran visual disederhanakan untuk menjelaskan konsep</text></svg>