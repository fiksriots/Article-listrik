<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420"><title>WireGuard: peer, kunci, alamat, dan rute</title><desc>Buat rencana VPN yang membedakan handshake dari akses layanan.</desc><rect width="800" height="420" rx="18" fill="#edf4ef"/><text x="35" y="43" font-family="Arial,sans-serif" font-size="13" fill="#236b62" letter-spacing="2">LEARN JARINGAN / 58</text><rect x="25" y="112" width="230" height="197" rx="14" fill="#fff" stroke="#bed2c1"/><circle cx="140" cy="161" r="22" fill="#236b62"/><text x="140" y="167" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#fff">1</text><text x="140" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#193a32">Peer + public key</text><rect x="285" y="112" width="230" height="197" rx="14" fill="#dcebe0" stroke="#bed2c1"/><circle cx="400" cy="161" r="22" fill="#236b62"/><text x="400" y="167" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#fff">2</text><text x="400" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#193a32">Tunnel + route</text><rect x="545" y="112" width="230" height="197" rx="14" fill="#fbf0e1" stroke="#bed2c1"/><circle cx="660" cy="161" r="22" fill="#236b62"/><text x="660" y="167" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#fff">3</text><text x="660" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#193a32">Layanan yang diizinkan</text><text x="400" y="365" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#5c7167">Peta konsep • baca hubungan dan contoh praktik pada materi</text></svg>