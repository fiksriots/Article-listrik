<svg xmlns="http://www.w3.org/2000/svg" width="840" height="420" viewBox="0 0 840 420" role="img" aria-labelledby="title"><title id="title">Perubahan arah dalam model harus melewati keadaan stop dan syarat berhenti</title><rect width="840" height="420" rx="20" fill="#f4f8fa"/><g font-family="Arial,sans-serif"><text x="30" y="45" font-size="25" fill="#334155" text-anchor="start">MODEL KEADAAN · BUKAN WIRING</text><rect x="300" y="75" width="240" height="100" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="320" y="113" font-size="25" fill="#1e3c3a" text-anchor="start">STOP</text><text x="320" y="149" font-size="20" fill="#334155" text-anchor="start">K1 OFF · K2 OFF</text><rect x="30" y="235" width="320" height="105" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="50" y="273" font-size="25" fill="#1e3c3a" text-anchor="start">MAJU</text><text x="50" y="309" font-size="20" fill="#334155" text-anchor="start">K1 ON · K2 OFF</text><rect x="490" y="235" width="320" height="105" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="510" y="273" font-size="25" fill="#1e3c3a" text-anchor="start">MUNDUR</text><text x="510" y="309" font-size="20" fill="#334155" text-anchor="start">K1 OFF · K2 ON</text><path d="M300 150 L190 230" fill="none" stroke="#27796e" stroke-width="4" stroke-linecap="round"/><path d="M540 150 L650 230" fill="none" stroke="#27796e" stroke-width="4" stroke-linecap="round"/><text x="70" y="200" font-size="20" fill="#334155" text-anchor="start">START maju</text><text x="610" y="200" font-size="20" fill="#334155" text-anchor="start">START mundur</text><text x="420" y="380" font-size="23" fill="#334155" text-anchor="middle">STOP + syarat aman sebelum mengganti arah</text></g></svg>