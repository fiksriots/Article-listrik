<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" role="img" aria-labelledby="title"><title id="title">Baca input adaptor, output adaptor, dan kebutuhan perangkat secara terpisah</title><rect width="840" height="400" rx="20" fill="#f4f8fa"/><g font-family="Arial,sans-serif"><text x="30" y="45" font-size="23" fill="#74617c" text-anchor="start">LABEL LATIHAN · BUKAN PRODUK NYATA</text><rect x="30" y="75" width="380" height="190" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="50" y="113" font-size="25" fill="#1e3c3a" text-anchor="start">ADAPTOR</text><text x="50" y="149" font-size="20" fill="#334155" text-anchor="start">INPUT: 100–240 V AC</text><text x="50" y="193" font-size="24" fill="#334155" text-anchor="start">50/60 Hz</text><text x="50" y="235" font-size="24" fill="#334155" text-anchor="start">OUTPUT: 12 V DC · 1 A</text><rect x="450" y="75" width="360" height="190" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="470" y="113" font-size="25" fill="#1e3c3a" text-anchor="start">PERANGKAT</text><text x="470" y="149" font-size="20" fill="#334155" text-anchor="start">INPUT: 12 V DC</text><text x="470" y="193" font-size="23" fill="#334155" text-anchor="start">Kebutuhan maks.: 0,8 A</text><text x="420" y="310" font-size="24" fill="#334155" text-anchor="middle">Cocokkan tegangan, jenis, polaritas,</text><text x="420" y="350" font-size="24" fill="#334155" text-anchor="middle">konektor, dan syarat produsen.</text></g></svg>