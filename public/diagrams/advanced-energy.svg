<svg xmlns="http://www.w3.org/2000/svg" width="840" height="420" viewBox="0 0 840 420" role="img" aria-labelledby="title"><title id="title">AUDIT · KONDISI HARUS SEBANDING</title><rect width="840" height="420" rx="18" fill="#f4f8fa"/><g font-family="Arial,sans-serif"><text x="30" y="42" font-size="23" fill="#334155">AUDIT · KONDISI HARUS SEBANDING</text><rect x="30" y="80" width="370" height="115" rx="13" fill="white" stroke="#bbc9ce" stroke-width="2"/><text x="47" y="118" font-size="23" fill="#214941">Baseline latihan</text><text x="47" y="160" font-size="19" fill="#475569">80 W × 24 jam = 1,92 kWh</text><rect x="440" y="80" width="370" height="115" rx="13" fill="white" stroke="#bbc9ce" stroke-width="2"/><text x="457" y="118" font-size="23" fill="#214941">Sesudah latihan</text><text x="457" y="160" font-size="19" fill="#475569">65 W × 24 jam = 1,56 kWh</text><rect x="30" y="225" width="370" height="115" rx="13" fill="white" stroke="#bbc9ce" stroke-width="2"/><text x="47" y="263" font-size="23" fill="#214941">Selisih energi</text><text x="47" y="305" font-size="19" fill="#475569">0,36 kWh/hari pada model</text><rect x="440" y="225" width="370" height="115" rx="13" fill="white" stroke="#bbc9ce" stroke-width="2"/><text x="457" y="263" font-size="23" fill="#214941">Verifikasi layanan</text><text x="457" y="305" font-size="19" fill="#475569">Jangan hilangkan proteksi</text><text x="420" y="390" text-anchor="middle" font-size="19" fill="#64748b">Ilustrasi konsep · angka contoh bukan spesifikasi produk.</text></g></svg>