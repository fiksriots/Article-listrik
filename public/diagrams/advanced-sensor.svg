<svg xmlns="http://www.w3.org/2000/svg" width="840" height="420" viewBox="0 0 840 420" role="img" aria-labelledby="title"><title id="title">BEDAKAN ANALOG DAN DIGITAL</title><rect width="840" height="420" rx="18" fill="#f4f8fa"/><g font-family="Arial,sans-serif"><text x="30" y="42" font-size="23" fill="#334155">BEDAKAN ANALOG DAN DIGITAL</text><rect x="30" y="80" width="370" height="115" rx="13" fill="white" stroke="#bbc9ce" stroke-width="2"/><text x="47" y="118" font-size="23" fill="#214941">Analog: 4–20 mA</text><text x="47" y="160" font-size="19" fill="#475569">Rentang sinyal → nilai proses</text><rect x="440" y="80" width="370" height="115" rx="13" fill="white" stroke="#bbc9ce" stroke-width="2"/><text x="457" y="118" font-size="23" fill="#214941">Contoh: 12 mA</text><text x="457" y="160" font-size="19" fill="#475569">0–100 °C linear → 50 °C</text><rect x="30" y="225" width="370" height="115" rx="13" fill="white" stroke="#bbc9ce" stroke-width="2"/><text x="47" y="263" font-size="23" fill="#214941">Digital: PNP/NPN</text><text x="47" y="305" font-size="19" fill="#475569">Cocokkan output dan input</text><rect x="440" y="225" width="370" height="115" rx="13" fill="white" stroke="#bbc9ce" stroke-width="2"/><text x="457" y="263" font-size="23" fill="#214941">Baca konfigurasi</text><text x="457" y="305" font-size="19" fill="#475569">Pinout · common · range</text><text x="420" y="390" text-anchor="middle" font-size="19" fill="#64748b">Ilustrasi konsep · angka contoh bukan spesifikasi produk.</text></g></svg>