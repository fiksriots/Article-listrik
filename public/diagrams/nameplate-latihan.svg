<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340"><title>Nameplate fiktif untuk latihan</title><rect width="800" height="340" rx="20" fill="#f0fdfa"/><g font-family="Arial,sans-serif" fill="#123b38" font-size="20"><rect x="30" y="30" width="740" height="280" rx="12" fill="#e2e8f0" stroke="#475569" stroke-width="3"/><text x="65" y="75" font-weight="bold">MOTOR LATIHAN · DATA FIKTIF</text><text x="65" y="125">3 phase · 1,5 kW (daya poros) · 50 Hz</text><text x="65" y="175">230 V Δ / 400 V Y · 6,0 A / 3,5 A</text><text x="65" y="225">1420 RPM · cos φ 0,80 · η 78%</text><text x="65" y="275">Bukan spesifikasi atau petunjuk pemasangan produk</text></g></svg>