<svg xmlns="http://www.w3.org/2000/svg" width="840" height="420" viewBox="0 0 840 420" role="img" aria-labelledby="title"><title id="title">PERKIRAAN ENERGI · BUKAN JAMINAN RUNTIME</title><rect width="840" height="420" rx="18" fill="#f4f8fa"/><g font-family="Arial,sans-serif"><text x="30" y="42" font-size="23" fill="#334155">PERKIRAAN ENERGI · BUKAN JAMINAN RUNTIME</text><rect x="30" y="80" width="370" height="115" rx="13" fill="white" stroke="#bbc9ce" stroke-width="2"/><text x="47" y="118" font-size="23" fill="#214941">Energi nominal</text><text x="47" y="160" font-size="19" fill="#475569">12 V × 9 Ah = 108 Wh</text><rect x="440" y="80" width="370" height="115" rx="13" fill="white" stroke="#bbc9ce" stroke-width="2"/><text x="457" y="118" font-size="23" fill="#214941">Asumsi latihan</text><text x="457" y="160" font-size="19" fill="#475569">60% tersedia × 80% efisiensi</text><rect x="30" y="225" width="370" height="115" rx="13" fill="white" stroke="#bbc9ce" stroke-width="2"/><text x="47" y="263" font-size="23" fill="#214941">Energi ke beban</text><text x="47" y="305" font-size="19" fill="#475569">108 × 0,6 × 0,8 = 51,84 Wh</text><rect x="440" y="225" width="370" height="115" rx="13" fill="white" stroke="#bbc9ce" stroke-width="2"/><text x="457" y="263" font-size="23" fill="#214941">Beban tetap 30 W</text><text x="457" y="305" font-size="19" fill="#475569">Model: sekitar 1,73 jam</text><text x="420" y="390" text-anchor="middle" font-size="19" fill="#64748b">Ilustrasi pembelajaran · gunakan manual dan rancangan yang sesuai.</text></g></svg>