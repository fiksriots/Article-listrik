<svg xmlns="http://www.w3.org/2000/svg" width="840" height="420" viewBox="0 0 840 420" role="img" aria-labelledby="title"><title id="title">CONTOH ALOKASI PSE · BUKAN SPESIFIKASI PRODUK</title><rect width="840" height="420" rx="18" fill="#f4f8fa"/><g font-family="Arial,sans-serif"><text x="30" y="42" font-size="23" fill="#334155">CONTOH ALOKASI PSE · BUKAN SPESIFIKASI PRODUK</text><rect x="30" y="80" width="370" height="115" rx="13" fill="white" stroke="#bbc9ce" stroke-width="2"/><text x="47" y="118" font-size="23" fill="#214941">4 kamera × 12 W</text><text x="47" y="160" font-size="19" fill="#475569">48 W alokasi contoh</text><rect x="440" y="80" width="370" height="115" rx="13" fill="white" stroke="#bbc9ce" stroke-width="2"/><text x="457" y="118" font-size="23" fill="#214941">2 AP × 16 W</text><text x="457" y="160" font-size="19" fill="#475569">32 W alokasi contoh</text><rect x="30" y="225" width="370" height="115" rx="13" fill="white" stroke="#bbc9ce" stroke-width="2"/><text x="47" y="263" font-size="23" fill="#214941">Total kebutuhan</text><text x="47" y="305" font-size="19" fill="#475569">48 + 32 = 80 W</text><rect x="440" y="225" width="370" height="115" rx="13" fill="white" stroke="#bbc9ce" stroke-width="2"/><text x="457" y="263" font-size="23" fill="#214941">Budget contoh 60 W</text><text x="457" y="305" font-size="19" fill="#475569">Tidak memenuhi; cek per port juga</text><text x="420" y="390" text-anchor="middle" font-size="19" fill="#64748b">Ilustrasi pembelajaran · gunakan manual dan rancangan yang sesuai.</text></g></svg>