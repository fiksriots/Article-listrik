<svg xmlns="http://www.w3.org/2000/svg" width="840" height="520" viewBox="0 0 840 520" role="img" aria-labelledby="title"><title id="title">Empat jenis gangguan dan alasan penanganannya berbeda</title><rect width="840" height="520" rx="20" fill="#f4f8fa"/><g font-family="Arial,sans-serif"><text x="30" y="45" font-size="26" fill="#334155" text-anchor="start">BEDAKAN PENYEBABNYA</text><rect x="30" y="75" width="375" height="175" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="50" y="113" font-size="25" fill="#1e3c3a" text-anchor="start">01 · Beban lebih</text><text x="50" y="149" font-size="20" fill="#334155" text-anchor="start">Arus beban terlalu besar</text><text x="50" y="200" font-size="20" fill="#334155" text-anchor="start">Jalur normal, beban berlebih</text><rect x="435" y="75" width="375" height="175" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="455" y="113" font-size="25" fill="#1e3c3a" text-anchor="start">02 · Hubung singkat</text><text x="455" y="149" font-size="20" fill="#334155" text-anchor="start">Jalur tak diinginkan</text><text x="455" y="200" font-size="20" fill="#334155" text-anchor="start">Impedansi jalur sangat rendah</text><rect x="30" y="280" width="375" height="175" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="50" y="318" font-size="25" fill="#1e3c3a" text-anchor="start">03 · Kebocoran</text><text x="50" y="354" font-size="20" fill="#334155" text-anchor="start">Arus keluar jalur normal</text><text x="50" y="405" font-size="20" fill="#334155" text-anchor="start">Perlu deteksi arus residual</text><rect x="435" y="280" width="375" height="175" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="455" y="318" font-size="25" fill="#1e3c3a" text-anchor="start">04 · Kontak longgar</text><text x="455" y="354" font-size="20" fill="#334155" text-anchor="start">Hambatan lokal bertambah</text><text x="455" y="405" font-size="24" fill="#334155" text-anchor="start">Panas: P = I² × R</text><text x="420" y="494" font-size="20" fill="#334155" text-anchor="middle">Gejala bukan diagnosis pasti · jangan membuat gangguan nyata</text></g></svg>