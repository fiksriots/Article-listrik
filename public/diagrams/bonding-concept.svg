<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" role="img" aria-labelledby="t"><title id="t">Beda potensial dan hubungan bonding terkoordinasi</title><rect width="840" height="400" rx="18" fill="#f3f7f9"/><g font-family="Arial,sans-serif"><text x="30" y="40" font-size="25" text-anchor="start" fill="#334155">BONDING MEMBATASI BEDA POTENSIAL</text><rect x="30" y="75" width="370" height="235" rx="12" fill="white" stroke="#b9c9c8" stroke-width="2"/><text x="48" y="110" font-size="24" text-anchor="start" fill="#334155">Dua bagian berbeda</text><text x="48" y="143" font-size="19" text-anchor="start" fill="#334155">A dan B dapat naik berbeda</text><rect x="440" y="75" width="370" height="235" rx="12" fill="white" stroke="#b9c9c8" stroke-width="2"/><text x="458" y="110" font-size="24" text-anchor="start" fill="#334155">Hubungan terkoordinasi</text><text x="458" y="143" font-size="19" text-anchor="start" fill="#334155">A dan B diikat sesuai desain</text><text x="105" y="220" font-size="40" text-anchor="start" fill="#334155">A</text><text x="290" y="220" font-size="40" text-anchor="start" fill="#334155">B</text><text x="90" y="265" font-size="22" text-anchor="start" fill="#334155">ΔV dapat muncul</text><text x="515" y="220" font-size="40" text-anchor="start" fill="#334155">A</text><text x="700" y="220" font-size="40" text-anchor="start" fill="#334155">B</text><path d="M550 210 L680 210" fill="none" stroke="#26786c" stroke-width="4"/><text x="485" y="265" font-size="22" text-anchor="start" fill="#334155">Bukan jaminan selalu 0 V</text><text x="420" y="365" font-size="21" text-anchor="middle" fill="#334155">Jangan menyamakan bonding dengan jumper N–PE sembarang.</text></g></svg>