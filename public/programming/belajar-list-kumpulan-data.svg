<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" role="img" aria-labelledby="title desc"><title id="title">Indeks dimulai dari nol</title><desc id="desc">len(nama) = 3, sedangkan indeks terakhir adalah 2.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#65508a"/></marker></defs><rect width="860" height="480" rx="18" fill="#f7f6f2"/><text x="36" y="48" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#263d38">Indeks dimulai dari nol</text><text x="36" y="82" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#263d38">len(nama) = 3, sedangkan indeks terakhir adalah 2.</text><rect x="60" y="145" width="235" height="155" rx="12" fill="#ffffff" stroke="#b5c7be" stroke-width="2"/><text x="78" y="180" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263d38">Araya</text><text x="78" y="214" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">indeks 0</text><text x="78" y="242" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">nama[0]</text><rect x="327" y="145" width="235" height="155" rx="12" fill="#ffffff" stroke="#b5c7be" stroke-width="2"/><text x="345" y="180" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263d38">Keputih</text><text x="345" y="214" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">indeks 1</text><text x="345" y="242" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">nama[1]</text><rect x="594" y="145" width="235" height="155" rx="12" fill="#ffffff" stroke="#b5c7be" stroke-width="2"/><text x="612" y="180" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263d38">Petra</text><text x="612" y="214" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">indeks 2</text><text x="612" y="242" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">nama[2]</text><text x="36" y="449" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#263d38">nama.append(&quot;Gubeng&quot;) menambahkan elemen baru pada indeks 3.</text></svg>