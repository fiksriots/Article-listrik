<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" role="img" aria-labelledby="title desc"><title id="title">Satu eksemplar, paling banyak satu pinjaman aktif</title><desc id="desc">Tabel Anggota dan Buku dirujuk Pinjaman. NULL pada kembali berarti aktif; indeks unik parsial menjaga satu aktif per buku.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#65508a"/></marker></defs><rect width="860" height="480" rx="20" fill="#faf6f1"/><g font-family="Arial,sans-serif" fill="#27334a"><text x="35" y="44" font-size="22" font-weight="bold">Satu eksemplar, paling banyak satu pinjaman aktif</text><rect x="30" y="122" width="235" height="115" rx="12" fill="#fff" stroke="#a18d7b"/><text x="48" y="154" font-size="21" font-weight="bold">Anggota</text><text x="48" y="185" font-size="16">id (primary key)</text><text x="48" y="210" font-size="16">nama</text><rect x="312" y="122" width="236" height="115" rx="12" fill="#f0ecf8" stroke="#a18d7b"/><text x="330" y="154" font-size="21" font-weight="bold">Pinjaman</text><text x="330" y="185" font-size="16">anggota_id, buku_id</text><text x="330" y="210" font-size="16">kembali (NULL = aktif)</text><rect x="595" y="122" width="235" height="115" rx="12" fill="#fff" stroke="#a18d7b"/><text x="613" y="154" font-size="21" font-weight="bold">Buku</text><text x="613" y="185" font-size="16">id (primary key)</text><text x="613" y="210" font-size="16">satu eksemplar fisik</text><path d="M265 178H302" fill="none" stroke="#65508a" stroke-width="2" marker-end="url(#a)"/><path d="M595 178H558" fill="none" stroke="#65508a" stroke-width="2" marker-end="url(#a)"/><text x="147" y="96" text-anchor="middle" font-size="17">1 → banyak pinjaman</text><text x="710" y="96" text-anchor="middle" font-size="17">1 → banyak riwayat</text><rect x="100" y="305" width="660" height="100" rx="14" fill="#edf5f7" stroke="#32718a"/><text x="430" y="341" text-anchor="middle" font-size="17">UNIQUE buku_id hanya saat kembali IS NULL</text><text x="430" y="375" text-anchor="middle" font-size="17">Pengembalian mengakhiri aktif; riwayat tetap disimpan.</text></g></svg>