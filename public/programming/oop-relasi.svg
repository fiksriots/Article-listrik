<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" role="img" aria-labelledby="title desc">
<title id="title">Pewarisan dibandingkan susunan objek</title><desc id="desc">TeknisiJaringan adalah jenis Teknisi, ditunjukkan pewarisan. Dashboard menggunakan objek pembaca, ditunjukkan hubungan referensi.</desc>
<defs><marker id="inherit" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto"><path d="M1 1 11 6 1 11Z" fill="#fff" stroke="#65508a"/></marker><marker id="use" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#32718a"/></marker></defs>
<rect width="860" height="480" rx="22" fill="#f6f5fa"/>
<g font-family="Arial,sans-serif" fill="#27334a"><text x="40" y="43" font-size="21" font-weight="bold">Pilih hubungan sesuai kebutuhan</text>
<text x="225" y="88" text-anchor="middle" font-size="18" fill="#65508a">INHERITANCE · adalah jenis</text><text x="635" y="88" text-anchor="middle" font-size="18" fill="#32718a">KOMPOSISI · menggunakan</text>
<rect x="65" y="118" width="320" height="90" rx="12" fill="#fff" stroke="#65508a"/><text x="225" y="154" text-anchor="middle" font-size="21" font-weight="bold">Teknisi</text><text x="225" y="184" text-anchor="middle" font-size="17">nama, ringkasan()</text>
<rect x="65" y="296" width="320" height="90" rx="12" fill="#f0ecf8" stroke="#65508a"/><text x="225" y="332" text-anchor="middle" font-size="21" font-weight="bold">TeknisiJaringan</text><text x="225" y="362" text-anchor="middle" font-size="17">area, override ringkasan()</text><path d="M225 296V216" stroke="#65508a" stroke-width="2" marker-end="url(#inherit)"/><text x="240" y="258" font-size="16">mewarisi</text>
<rect x="475" y="118" width="320" height="90" rx="12" fill="#edf5f7" stroke="#32718a"/><text x="635" y="154" text-anchor="middle" font-size="21" font-weight="bold">Dashboard</text><text x="635" y="184" text-anchor="middle" font-size="17">pembaca, tampilkan()</text>
<rect x="475" y="296" width="320" height="90" rx="12" fill="#fff" stroke="#32718a"/><text x="635" y="332" text-anchor="middle" font-size="21" font-weight="bold">Objek pembaca</text><text x="635" y="362" text-anchor="middle" font-size="17">baca() → angka</text><path d="M635 208V288" stroke="#32718a" stroke-width="2" marker-end="url(#use)"/><text x="650" y="258" font-size="16">memanggil</text>
<text x="225" y="430" text-anchor="middle" font-size="16">Turunan memenuhi kontrak induk.</text><text x="635" y="430" text-anchor="middle" font-size="16">Pembaca dapat diganti lewat konstruktor.</text><text x="635" y="456" text-anchor="middle" font-size="15" fill="#58647b">Dashboard bukan jenis pembaca.</text></g></svg>
