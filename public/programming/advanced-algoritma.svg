<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" role="img" aria-labelledby="title"><title id="title">Memilih strategi algoritma</title><rect width="860" height="480" rx="24" fill="#f3f7f4"/><g font-family="Arial,sans-serif" fill="#193d37"><text x="38" y="58" font-size="27" font-weight="700">Memilih strategi algoritma</text><text x="38" y="91" font-size="17">Koin [1, 3, 4] · target 6</text><rect x="38" y="137" width="250" height="216" rx="14" fill="white" stroke="#bdd3c8"/><text x="54" y="180" font-size="18" font-weight="700">Greedy</text><text x="54" y="234" font-size="14">Ambil terbesar dahulu</text><text x="54" y="282" font-size="14">4 + 1 + 1 → 3 koin</text><rect x="304" y="137" width="250" height="216" rx="14" fill="white" stroke="#bdd3c8"/><text x="320" y="180" font-size="18" font-weight="700">Backtracking</text><text x="320" y="234" font-size="14">Telusuri pilihan dan batalkan</text><text x="320" y="282" font-size="14">Bandingkan kandidat solusi</text><rect x="570" y="137" width="250" height="216" rx="14" fill="white" stroke="#bdd3c8"/><text x="586" y="180" font-size="18" font-weight="700">Dynamic programming</text><text x="586" y="234" font-size="14">Simpan minimum tiap target</text><text x="586" y="282" font-size="14">dp[6] = 2 → 3 + 3</text><text x="38" y="416" font-size="17">Greedy perlu alasan optimalitas; contoh tandingan membantu menguji dugaan.</text></g></svg>