<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" role="img" aria-labelledby="title desc"><title id="title">netprog-framing</title><desc id="desc">Dua frame berisi header panjang empat byte dan payload tiga byte masing-masing. Batas recv tidak harus sesuai batas frame.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#526f70"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#183238}.title{font-size:24px;font-weight:700}.label{font-size:19px;font-weight:700}.small{font-size:16px}.note{font-size:15px;fill:#476165}.line{fill:none;stroke:#526f70;stroke-width:2.5;marker-end:url(#arrow)}</style><rect width="860" height="480" rx="22" fill="#f7faf9"/><text x="40" y="48" class="title" text-anchor="start">Framing: panjang dahulu, lalu payload</text><text x="40" y="85" class="small" text-anchor="start">Contoh dua pesan: satu (3 byte) dan dua (3 byte)</text><rect x="40" y="120" width="157" height="75" rx="15" fill="#d5e8e4"/><text x="118.5" y="163" class="label" text-anchor="middle">00000003</text><rect x="200" y="120" width="177" height="75" rx="15" fill="#e5e4f0"/><text x="288.5" y="163" class="label" text-anchor="middle">satu</text><rect x="380" y="120" width="157" height="75" rx="15" fill="#d5e8e4"/><text x="458.5" y="163" class="label" text-anchor="middle">00000003</text><rect x="540" y="120" width="177" height="75" rx="15" fill="#e5e4f0"/><text x="628.5" y="163" class="label" text-anchor="middle">dua</text><text x="120" y="218" class="note" text-anchor="middle">header 4 byte</text><text x="285" y="218" class="note" text-anchor="middle">payload 3 byte</text><text x="460" y="218" class="note" text-anchor="middle">header 4 byte</text><text x="630" y="218" class="note" text-anchor="middle">payload 3 byte</text><path class="line" d="M430 240V277"/><text x="430" y="313" class="label" text-anchor="middle">recv dapat memotong header atau payload</text><rect x="85" y="342" width="690" height="63" rx="15" fill="#fff"/><text x="430" y="380" class="small" text-anchor="middle">recv_exact(4) → validasi panjang → recv_exact(panjang)</text><text x="430" y="445" class="note" text-anchor="middle">Header ditulis dalam heksadesimal untuk ilustrasi. Batas payload lab: 4096 byte.</text></svg>