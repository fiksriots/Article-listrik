<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" role="img" aria-labelledby="title desc"><title id="title">Pipeline belajar hanya dari training</title><desc id="desc">Data test memakai parameter yang sudah dipelajari.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#65508a"/></marker></defs><rect width="860" height="480" rx="18" fill="#f7f6f2"/><text x="36" y="48" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#263d38">Pipeline belajar hanya dari training</text><text x="36" y="82" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#263d38">Data test memakai parameter yang sudah dipelajari.</text><rect x="36" y="135" width="235" height="120" rx="12" fill="#ffffff" stroke="#b5c7be" stroke-width="2"/><text x="54" y="170" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263d38">Training</text><text x="54" y="204" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">Fit transformasi</text><text x="54" y="232" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">Fit model</text><rect x="312" y="135" width="235" height="120" rx="12" fill="#ffffff" stroke="#b5c7be" stroke-width="2"/><text x="330" y="170" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263d38">Parameter tersimpan</text><text x="330" y="204" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">Imputasi dan scaling</text><text x="330" y="232" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">Parameter model</text><rect x="588" y="135" width="235" height="120" rx="12" fill="#ffffff" stroke="#b5c7be" stroke-width="2"/><text x="606" y="170" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263d38">Prediksi test</text><text x="606" y="204" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">Transform saja</text><text x="606" y="232" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">Predict, lalu evaluasi</text><path d="M275 195L306 195" fill="none" stroke="#65508a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M551 195L582 195" fill="none" stroke="#65508a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="140" y="315" width="580" height="85" rx="12" fill="#e4ede7" stroke="#b5c7be" stroke-width="2"/><text x="158" y="350" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263d38">Cross-validation</text><text x="158" y="384" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">Fit pipeline ulang hanya pada training setiap fold.</text><text x="36" y="449" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#263d38">Pipeline membantu menjaga batas split; pemilihan fitur tetap harus benar.</text></svg>