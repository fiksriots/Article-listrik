<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" role="img" aria-labelledby="title desc"><title id="title">Parameter masuk, hasil kembali</title><desc id="desc">Pemanggilan fungsi berbeda dari definisi fungsi.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#65508a"/></marker></defs><rect width="860" height="480" rx="18" fill="#f7f6f2"/><text x="36" y="48" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#263d38">Parameter masuk, hasil kembali</text><text x="36" y="82" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#263d38">Pemanggilan fungsi berbeda dari definisi fungsi.</text><rect x="36" y="145" width="235" height="180" rx="12" fill="#ffffff" stroke="#b5c7be" stroke-width="2"/><text x="54" y="180" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263d38">Pemanggil</text><text x="54" y="214" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">hasil = kali(3, 4)</text><text x="54" y="242" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">Argumen: 3 dan 4</text><rect x="312" y="145" width="235" height="180" rx="12" fill="#ffffff" stroke="#b5c7be" stroke-width="2"/><text x="330" y="180" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263d38">Fungsi kali(a, b)</text><text x="330" y="214" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">a = 3, b = 4</text><text x="330" y="242" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">return a * b</text><rect x="588" y="145" width="235" height="180" rx="12" fill="#ffffff" stroke="#b5c7be" stroke-width="2"/><text x="606" y="180" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263d38">Hasil</text><text x="606" y="214" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">Nilai kembali: 12</text><text x="606" y="242" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">hasil menyimpan 12</text><path d="M275 235L306 235" fill="none" stroke="#65508a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M551 235L582 235" fill="none" stroke="#65508a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="36" y="449" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#263d38">print menampilkan nilai; return mengembalikannya ke pemanggil.</text></svg>