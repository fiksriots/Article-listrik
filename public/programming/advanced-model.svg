<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" role="img" aria-labelledby="title"><title id="title">Eksperimen yang dapat ditelusuri</title><rect width="860" height="480" rx="24" fill="#f3f7f4"/><g font-family="Arial,sans-serif" fill="#193d37"><text x="38" y="58" font-size="27" font-weight="700">Eksperimen yang dapat ditelusuri</text><text x="38" y="91" font-size="17">Data sintetis · 80 baris · seed 42</text><rect x="38" y="137" width="250" height="216" rx="14" fill="white" stroke="#bdd3c8"/><text x="54" y="180" font-size="18" font-weight="700">Train · 48 baris</text><text x="54" y="234" font-size="14">Fit pipeline tiap alpha</text><text x="54" y="282" font-size="14">Scaler tidak melihat validation</text><rect x="304" y="137" width="250" height="216" rx="14" fill="white" stroke="#bdd3c8"/><text x="320" y="180" font-size="18" font-weight="700">Validation · 16 baris</text><text x="320" y="234" font-size="14">Pilih alpha dengan MAE</text><text x="320" y="282" font-size="14">Refit train + validation</text><rect x="570" y="137" width="250" height="216" rx="14" fill="white" stroke="#bdd3c8"/><text x="586" y="180" font-size="18" font-weight="700">Test · 16 baris</text><text x="586" y="234" font-size="14">Evaluasi akhir sekali</text><text x="586" y="282" font-size="14">Simpan model + manifest</text><text x="38" y="416" font-size="17">Hash memeriksa integritas; hanya muat model dari sumber tepercaya.</text></g></svg>