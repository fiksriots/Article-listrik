<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" role="img" aria-labelledby="title desc"><title id="title">Precision dan recall menjawab pertanyaan berbeda</title><desc id="desc">Contoh: 10 gangguan nyata, 8 prediksi gangguan, 6 benar.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#65508a"/></marker></defs><rect width="860" height="480" rx="18" fill="#f7f6f2"/><text x="36" y="48" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#263d38">Precision dan recall menjawab pertanyaan berbeda</text><text x="36" y="82" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#263d38">Contoh: 10 gangguan nyata, 8 prediksi gangguan, 6 benar.</text><rect x="36.0" y="130" width="262.6666666666667" height="65" fill="#e4ede7" stroke="#b5c7be"/><text x="50.0" y="164" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#263d38">Keadaan sebenarnya</text><rect x="298.6666666666667" y="130" width="262.6666666666667" height="65" fill="#e4ede7" stroke="#b5c7be"/><text x="312.6666666666667" y="164" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#263d38">Prediksi gangguan</text><rect x="561.3333333333334" y="130" width="262.6666666666667" height="65" fill="#e4ede7" stroke="#b5c7be"/><text x="575.3333333333334" y="164" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#263d38">Prediksi normal</text><rect x="36.0" y="195" width="262.6666666666667" height="65" fill="#ffffff" stroke="#b5c7be"/><text x="50.0" y="229" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#263d38">Gangguan</text><rect x="298.6666666666667" y="195" width="262.6666666666667" height="65" fill="#ffffff" stroke="#b5c7be"/><text x="312.6666666666667" y="229" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#263d38">6 benar positif</text><rect x="561.3333333333334" y="195" width="262.6666666666667" height="65" fill="#ffffff" stroke="#b5c7be"/><text x="575.3333333333334" y="229" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#263d38">4 terlewat</text><rect x="36.0" y="260" width="262.6666666666667" height="65" fill="#ffffff" stroke="#b5c7be"/><text x="50.0" y="294" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#263d38">Normal</text><rect x="298.6666666666667" y="260" width="262.6666666666667" height="65" fill="#ffffff" stroke="#b5c7be"/><text x="312.6666666666667" y="294" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#263d38">2 alarm palsu</text><rect x="561.3333333333334" y="260" width="262.6666666666667" height="65" fill="#ffffff" stroke="#b5c7be"/><text x="575.3333333333334" y="294" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#263d38">Tidak ditentukan</text><rect x="45" y="345" width="370" height="65" rx="12" fill="#e4ede7" stroke="#b5c7be" stroke-width="2"/><text x="63" y="380" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263d38">Precision: 6 / 8 = 75%</text><rect x="445" y="345" width="370" height="65" rx="12" fill="#e4ede7" stroke="#b5c7be" stroke-width="2"/><text x="463" y="380" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263d38">Recall: 6 / 10 = 60%</text></svg>