<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" role="img" aria-labelledby="title desc"><title id="title">Tiga relasi objek</title><desc id="desc">Association menghubungkan Peminjaman dan Buku. Aggregation mengelompokkan Buku mandiri di Perpustakaan. Composition menggambarkan kepemilikan BarisLaporan oleh Laporan.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#65508a"/></marker></defs><rect width="860" height="480" rx="20" fill="#f6f5fa"/><g font-family="Arial,sans-serif" fill="#27334a"><text x="35" y="44" font-size="22" font-weight="bold">Hubungan dan kepemilikan perlu disepakati</text>
<text x="35" y="104" font-size="18" font-weight="bold">Association</text><rect x="205" y="75" width="235" height="76" rx="12" fill="white" stroke="#65508a"/><text x="322" y="120" text-anchor="middle" font-size="20">Peminjaman</text><path d="M440 113H585" stroke="#65508a" stroke-width="2" marker-end="url(#a)"/><text x="511" y="97" text-anchor="middle" font-size="15">menghubungkan</text><rect x="590" y="75" width="235" height="76" rx="12" fill="white" stroke="#65508a"/><text x="707" y="120" text-anchor="middle" font-size="20">Buku</text><text x="205" y="177" font-size="16">Hubungan tidak otomatis menyatakan kepemilikan.</text>
<text x="35" y="240" font-size="18" font-weight="bold">Aggregation</text><rect x="205" y="211" width="235" height="76" rx="12" fill="white" stroke="#65508a"/><text x="322" y="256" text-anchor="middle" font-size="20">Perpustakaan</text><path d="M440 249H585" stroke="#65508a" stroke-width="2" marker-end="url(#a)"/><text x="511" y="233" text-anchor="middle" font-size="15">mengelompokkan</text><rect x="590" y="211" width="235" height="76" rx="12" fill="white" stroke="#65508a"/><text x="707" y="256" text-anchor="middle" font-size="20">Buku mandiri</text><text x="205" y="313" font-size="16">Buku dibuat dari luar dan dapat tetap digunakan secara mandiri.</text>
<text x="35" y="376" font-size="18" font-weight="bold">Composition</text><rect x="205" y="347" width="235" height="76" rx="12" fill="#edf5f7" stroke="#32718a"/><text x="322" y="392" text-anchor="middle" font-size="20">Laporan</text><path d="M440 385H585" stroke="#65508a" stroke-width="2" marker-end="url(#a)"/><text x="511" y="369" text-anchor="middle" font-size="15">memiliki bagian</text><rect x="590" y="347" width="235" height="76" rx="12" fill="#edf5f7" stroke="#32718a"/><text x="707" y="392" text-anchor="middle" font-size="20">BarisLaporan</text><text x="205" y="452" font-size="16">Kepemilikan konseptual; Python tidak memaksakannya otomatis.</text></g></svg>
