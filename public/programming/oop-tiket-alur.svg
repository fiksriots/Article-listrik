<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" role="img" aria-labelledby="title desc"><title id="title">Alur tiket gangguan jaringan</title><desc id="desc">Tiket baru ditugaskan kepada teknisi terdaftar sebelum diproses dan diselesaikan. Snapshot JSON diperiksa dan dipulihkan melalui operasi domain.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#65508a"/></marker></defs><rect width="860" height="480" rx="20" fill="#f6f5fa"/><g font-family="Arial,sans-serif" fill="#27334a"><text x="35" y="44" font-size="23" font-weight="bold">Satu tiket mengikuti alur yang diperiksa</text><text x="35" y="84" font-size="18">Registry memastikan kode teknisi dan nomor tiket unik.</text>
<g stroke="#65508a" fill="white"><rect x="30" y="140" width="170" height="94" rx="12"/><rect x="240" y="140" width="170" height="94" rx="12"/><rect x="450" y="140" width="170" height="94" rx="12"/><rect x="660" y="140" width="170" height="94" rx="12"/></g>
<g font-size="19" font-weight="bold" text-anchor="middle"><text x="115" y="194">BARU</text><text x="325" y="194">DITUGASKAN</text><text x="535" y="194">DIPROSES</text><text x="745" y="194">SELESAI</text></g><g stroke="#65508a" stroke-width="2" marker-end="url(#a)"><path d="M200 187H233"/><path d="M410 187H443"/><path d="M620 187H653"/></g>
<text x="325" y="269" text-anchor="middle" font-size="16">Teknisi harus terdaftar.</text><text x="650" y="269" text-anchor="middle" font-size="16">Lompatan status ditolak.</text>
<rect x="85" y="322" width="690" height="100" rx="14" fill="#edf5f7" stroke="#32718a"/><text x="430" y="356" text-anchor="middle" font-size="20" font-weight="bold">JSON: versi + teknisi + tiket + riwayat</text><text x="430" y="389" text-anchor="middle" font-size="17">Muat → periksa skema dan referensi → jalankan kembali alur.</text><text x="430" y="453" text-anchor="middle" font-size="16">Riwayat latihan berupa urutan status, belum audit lengkap.</text></g></svg>
