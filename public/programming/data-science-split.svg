<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" role="img" aria-labelledby="title desc"><title id="title">Pisahkan data sebelum belajar</title><desc id="desc">Split data menjadi bagian pengembangan dan test. Fit serta validation hanya pada bagian pengembangan. Test dipakai untuk evaluasi akhir.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#8a7ca0"/></marker></defs><rect width="860" height="480" rx="24" fill="#f3eff9"/><g font-family="system-ui,sans-serif" text-anchor="middle" fill="#303651"><text x="430" y="48" font-size="24" font-weight="700">Belajar dari train, uji pada data terpisah</text><rect x="255" y="85" width="350" height="88" rx="16" fill="white"/><text x="430" y="121" font-size="22" font-weight="700">Data → split yang sesuai</text><text x="430" y="151" font-size="15">Perhatikan waktu, kelompok, dan duplikat</text><g stroke="#8a7ca0" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M430 179V202H212V238"/><path d="M430 179V202H650V238"/><path d="M385 306H469"/></g><rect x="36" y="244" width="350" height="126" rx="16" fill="#dcece8"/><text x="211" y="278" font-size="22" font-weight="700">Train / pengembangan</text><text x="211" y="312" font-size="18">Fit preprocessing dan model</text><text x="211" y="345" font-size="17">Validation untuk memilih konfigurasi</text><rect x="474" y="244" width="350" height="126" rx="16" fill="#e2e8f5"/><text x="649" y="278" font-size="22" font-weight="700">Test akhir</text><text x="649" y="312" font-size="18">Transform dan evaluasi</text><text x="649" y="345" font-size="17">Setelah keputusan model dikunci</text><text x="430" y="289" font-size="12">model</text><text x="430" y="329" font-size="12">terpilih</text><text x="430" y="427" font-size="18">Jangan fit scaler, memilih fitur, atau memilih ambang dari test.</text><text x="430" y="454" font-size="16">Skor simulasi bukan jaminan kinerja lapangan.</text></g></svg>
