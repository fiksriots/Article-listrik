<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" role="img" aria-labelledby="title desc"><title id="title">Request Django menjadi halaman</title><desc id="desc">Setiap bagian mempunyai tugas yang berbeda.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#65508a"/></marker></defs><rect width="860" height="480" rx="18" fill="#f7f6f2"/><text x="36" y="48" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#263d38">Request Django menjadi halaman</text><text x="36" y="82" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#263d38">Setiap bagian mempunyai tugas yang berbeda.</text><rect x="36" y="130" width="235" height="165" rx="12" fill="#ffffff" stroke="#b5c7be" stroke-width="2"/><text x="54" y="165" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263d38">1 · URLconf</text><text x="54" y="199" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">Cocokkan path</text><text x="54" y="227" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">Pilih view</text><rect x="312" y="130" width="235" height="165" rx="12" fill="#ffffff" stroke="#b5c7be" stroke-width="2"/><text x="330" y="165" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263d38">2 · View</text><text x="330" y="199" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">Periksa akses</text><text x="330" y="227" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">Ambil data dari ORM</text><rect x="588" y="130" width="235" height="165" rx="12" fill="#ffffff" stroke="#b5c7be" stroke-width="2"/><text x="606" y="165" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263d38">3 · Response</text><text x="606" y="199" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">Render template</text><text x="606" y="227" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">Kirim HTML</text><path d="M275 212L306 212" fill="none" stroke="#65508a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M551 212L582 212" fill="none" stroke="#65508a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="180" y="340" width="500" height="65" rx="12" fill="#e4ede7" stroke="#b5c7be" stroke-width="2"/><text x="198" y="375" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263d38">ID pada URL tetap perlu diperiksa di view.</text></svg>