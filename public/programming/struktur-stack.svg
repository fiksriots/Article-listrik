<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" role="img" aria-labelledby="title"><title id="title">Stack: terakhir masuk, pertama keluar</title><defs><marker id="a" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 L8 3.5 L0 7" fill="#655a85"/></marker></defs><rect width="860" height="480" rx="24" fill="#f4f1f8"/><g font-family="Arial,sans-serif" fill="#28243d"><text x="430" y="48" text-anchor="middle" font-size="27">Stack: terakhir masuk, pertama keluar</text><rect x="260" y="145" width="300" height="70" rx="12" fill="white" stroke="#655a85" stroke-width="2"/><text x="410.0" y="187.0" text-anchor="middle" font-size="20">C · item terbaru</text><rect x="260" y="225" width="300" height="70" rx="12" fill="white" stroke="#655a85" stroke-width="2"/><text x="410.0" y="267.0" text-anchor="middle" font-size="20">B</text><rect x="260" y="305" width="300" height="70" rx="12" fill="white" stroke="#655a85" stroke-width="2"/><text x="410.0" y="347.0" text-anchor="middle" font-size="20">A · item pertama</text><text x="410" y="115" text-anchor="middle" font-size="19">Ujung atas: push dan pop</text><path d="M640 180 H573" stroke="#655a85" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="685" y="160" text-anchor="middle" font-size="18">Push</text><path d="M573 205 H640" stroke="#655a85" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="685" y="218" text-anchor="middle" font-size="18">Pop</text><text x="430" y="435" text-anchor="middle" font-size="20">Urutan keluar: C, lalu B, lalu A.</text></g></svg>