<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" role="img" aria-labelledby="title desc"><title id="title">Isolasi persiapan setiap test</title><desc id="desc">Fixture yang dapat diubah perlu cakupan dan pembersihan yang sesuai.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#65508a"/></marker></defs><rect width="860" height="480" rx="18" fill="#f7f6f2"/><text x="36" y="48" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#263d38">Isolasi persiapan setiap test</text><text x="36" y="82" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#263d38">Fixture yang dapat diubah perlu cakupan dan pembersihan yang sesuai.</text><rect x="36" y="145" width="235" height="170" rx="12" fill="#ffffff" stroke="#b5c7be" stroke-width="2"/><text x="54" y="180" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263d38">Test A</text><text x="54" y="214" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">Data baru</text><text x="54" y="242" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">Ubah → periksa</text><rect x="312" y="145" width="235" height="170" rx="12" fill="#ffffff" stroke="#b5c7be" stroke-width="2"/><text x="330" y="180" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263d38">Test B</text><text x="330" y="214" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">Data baru</text><text x="330" y="242" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">Ubah → periksa</text><rect x="588" y="145" width="235" height="170" rx="12" fill="#ffffff" stroke="#b5c7be" stroke-width="2"/><text x="606" y="180" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263d38">Test C</text><text x="606" y="214" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">Data baru</text><text x="606" y="242" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">Ubah → periksa</text><text x="36" y="449" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#263d38">Keadaan yang berubah pada A tidak boleh diam-diam menjadi masukan B.</text></svg>