<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" role="img" aria-labelledby="title desc"><title id="title">Penelusuran CTE rekursif pada graph</title><desc id="desc">A menunjuk B, B menunjuk C dan D, C kembali ke A. UNION pada satu kolom node mencegah node sama terus ditambahkan.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#65508a"/></marker></defs><rect width="860" height="480" rx="20" fill="#faf6f1"/><g font-family="Arial,sans-serif" fill="#27334a"><text x="35" y="44" font-size="22" font-weight="bold">Mulai dari A, tambahkan hanya node yang baru</text><g fill="white" stroke="#65508a" stroke-width="2"><circle cx="160" cy="180" r="45"/><circle cx="430" cy="180" r="45"/><circle cx="700" cy="180" r="45"/><circle cx="430" cy="340" r="45"/></g><g font-size="29" text-anchor="middle" font-weight="bold"><text x="160" y="190">A</text><text x="430" y="190">B</text><text x="700" y="190">C</text><text x="430" y="350">D</text></g><g fill="none" stroke="#65508a" stroke-width="2" marker-end="url(#a)"><path d="M205 180H375"/><path d="M475 180H645"/><path d="M430 225V286"/><path d="M700 135V90H160V125"/></g><text x="430" y="78" text-anchor="middle" font-size="17">C kembali ke A: siklus</text><text x="430" y="437" text-anchor="middle" font-size="17">Hasil satu kolom node + UNION: A, B, C, D.</text><text x="430" y="463" text-anchor="middle" font-size="16">Menambah kolom depth memerlukan penjaga siklus yang berbeda.</text></g></svg>
