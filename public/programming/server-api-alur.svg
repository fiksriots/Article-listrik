<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" role="img" aria-labelledby="title desc"><title id="title">Alur aplikasi API dan database</title><desc id="desc">Client berkomunikasi dengan API melalui HTTP. Service memeriksa aturan dan unit transaksi, repository menjalankan akses data, database menjaga penyimpanan dan constraint.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#65508a"/></marker></defs><rect width="860" height="480" rx="20" fill="#f5f5fa"/><g font-family="Arial,sans-serif" fill="#27334a"><text x="35" y="43" font-size="22" font-weight="bold">Kontrak jelas dari request sampai penyimpanan</text><g fill="white" stroke="#65508a"><rect x="30" y="105" width="205" height="110" rx="12"/><rect x="310" y="105" width="240" height="110" rx="12"/><rect x="310" y="285" width="240" height="110" rx="12"/><rect x="600" y="285" width="230" height="110" rx="12"/><rect x="600" y="105" width="230" height="110" rx="12"/></g><g font-size="21" font-weight="bold"><text x="50" y="140">Client</text><text x="330" y="140">API</text><text x="330" y="320">Service</text><text x="620" y="320">Repository</text><text x="620" y="140">Database</text></g><g font-size="16"><text x="50" y="173">Browser / aplikasi</text><text x="50" y="197">HTTP dan JSON</text><text x="330" y="173">Validasi request</text><text x="330" y="197">Status dan response</text><text x="330" y="353">Aturan bisnis</text><text x="330" y="377">Batas transaksi</text><text x="620" y="353">Kueri dan perubahan</text><text x="620" y="377">Kontrak akses data</text><text x="620" y="173">Tabel dan relasi</text><text x="620" y="197">Constraint engine</text></g><g fill="none" stroke="#65508a" stroke-width="2" marker-end="url(#a)"><path d="M235 160H300"/><path d="M430 215V275"/><path d="M550 340H590"/><path d="M715 285V225"/></g><text x="430" y="447" text-anchor="middle" font-size="17">Tes memeriksa hasil, kegagalan, dan efek transaksi pada tiap lapisan.</text></g></svg>
