<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" role="img" aria-labelledby="title desc"><title id="title">netprog-alur</title><desc id="desc">Client mengirim permintaan dan menerima balasan melalui endpoint server lokal. Transport dan aturan aplikasi harus disepakati.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#526f70"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#183238}.title{font-size:24px;font-weight:700}.label{font-size:19px;font-weight:700}.small{font-size:16px}.note{font-size:15px;fill:#476165}.line{fill:none;stroke:#526f70;stroke-width:2.5;marker-end:url(#arrow)}</style><rect width="860" height="480" rx="22" fill="#f7faf9"/><text x="40" y="48" class="title" text-anchor="start">Dua program, satu komputer latihan</text><rect x="40" y="90" width="780" height="330" rx="15" fill="#edf3f1"/><text x="430" y="121" class="note" text-anchor="middle">Loopback 127.0.0.1 · port dipilih OS</text><rect x="75" y="160" width="220" height="100" rx="15" fill="#d5e8e4"/><text x="185" y="199" class="label" text-anchor="middle">Client Python</text><text x="185" y="229" class="small" text-anchor="middle">Memulai permintaan</text><rect x="565" y="160" width="220" height="100" rx="15" fill="#e3e2ee"/><text x="675" y="199" class="label" text-anchor="middle">Server Python</text><text x="675" y="229" class="small" text-anchor="middle">Menunggu dan melayani</text><path class="line" d="M300 181H557"/><path class="line" d="M560 238H303"/><text x="430" y="168" class="note" text-anchor="middle">Bytes permintaan</text><text x="430" y="265" class="note" text-anchor="middle">Bytes balasan</text><rect x="120" y="305" width="270" height="75" rx="15" fill="#fff"/><text x="255" y="334" class="label" text-anchor="middle">TCP atau UDP</text><text x="255" y="360" class="small" text-anchor="middle">Pilih aturan transport</text><rect x="470" y="305" width="270" height="75" rx="15" fill="#fff"/><text x="605" y="334" class="label" text-anchor="middle">Protokol aplikasi</text><text x="605" y="360" class="small" text-anchor="middle">Sepakati arti dan batas pesan</text><text x="430" y="453" class="note" text-anchor="middle">TCP membawa aliran byte; UDP membawa datagram. Keduanya perlu aturan aplikasi.</text></svg>