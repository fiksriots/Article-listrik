<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" role="img" aria-labelledby="title desc"><title id="title">Rekonsiliasi hasil impor CSV</title><desc id="desc">Kontrak contoh mengizinkan baris valid diteruskan.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#65508a"/></marker></defs><rect width="860" height="480" rx="18" fill="#f7f6f2"/><text x="36" y="48" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#263d38">Rekonsiliasi hasil impor CSV</text><text x="36" y="82" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#263d38">Kontrak contoh mengizinkan baris valid diteruskan.</text><rect x="36" y="150" width="235" height="170" rx="12" fill="#ffffff" stroke="#b5c7be" stroke-width="2"/><text x="54" y="185" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263d38">10 baris sumber</text><text x="54" y="219" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">Periksa header</text><text x="54" y="247" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">Validasi tiap baris</text><rect x="312" y="150" width="235" height="170" rx="12" fill="#ffffff" stroke="#b5c7be" stroke-width="2"/><text x="330" y="185" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263d38">8 baris diterima</text><text x="330" y="219" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">Simpan data valid</text><text x="330" y="247" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">Lanjutkan laporan</text><rect x="588" y="150" width="235" height="170" rx="12" fill="#ffffff" stroke="#b5c7be" stroke-width="2"/><text x="606" y="185" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263d38">2 baris ditolak</text><text x="606" y="219" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">Catat nomor baris</text><text x="606" y="247" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">Catat alasan</text><path d="M275 235L306 235" fill="none" stroke="#65508a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M276 320L580 320" fill="none" stroke="#65508a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="36" y="449" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#263d38">10 dibaca = 8 diterima + 2 ditolak. Sumber tetap dapat ditelusuri.</text></svg>