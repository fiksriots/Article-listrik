<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" role="img" aria-labelledby="title desc"><title id="title">netprog-monitoring</title><desc id="desc">Dua endpoint loopback diperiksa dengan timeout dan jumlah worker terbatas. Hasil dicatat dalam CSV tanpa klaim SLA.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#526f70"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#183238}.title{font-size:24px;font-weight:700}.label{font-size:19px;font-weight:700}.small{font-size:16px}.note{font-size:15px;fill:#476165}.line{fill:none;stroke:#526f70;stroke-width:2.5;marker-end:url(#arrow)}</style><rect width="860" height="480" rx="22" fill="#f7faf9"/><text x="40" y="48" class="title" text-anchor="start">Pemeriksa layanan: batasi target dan kesimpulan</text><rect x="40" y="94" width="320" height="92" rx="15" fill="#e1efec"/><text x="200" y="130" class="label" text-anchor="middle">lab-aktif</text><text x="200" y="160" class="small" text-anchor="middle">Listener TCP lokal</text><rect x="500" y="94" width="320" height="92" rx="15" fill="#e8e5ee"/><text x="660" y="130" class="label" text-anchor="middle">lab-tutup</text><text x="660" y="160" class="small" text-anchor="middle">Port lokal tidak listen</text><path class="line" d="M200 187V214H350V237"/><path class="line" d="M660 187V214H510V237"/><rect x="265" y="240" width="330" height="82" rx="15" fill="#fff"/><text x="430" y="273" class="label" text-anchor="middle">Koneksi TCP + timeout</text><text x="430" y="301" class="small" text-anchor="middle">Dua target, maksimal dua worker</text><path class="line" d="M430 323V356"/><rect x="160" y="361" width="540" height="57" rx="15" fill="#e1efec"/><text x="430" y="396" class="label" text-anchor="middle">Klasifikasi hasil → simpan laporan CSV</text><text x="430" y="456" class="note" text-anchor="middle">Berhasil terhubung belum menguji isi aplikasi, kualitas RF, atau SLA.</text></svg>