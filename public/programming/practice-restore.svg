<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" role="img" aria-label="Backup dan pemulihan SQLite pada file baru"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#587579"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#20383e;text-anchor:middle}.h{font-size:24px;font-weight:700}.b{font-size:19px;font-weight:700}.s{font-size:16px}.line{fill:none;stroke:#587579;stroke-width:2.5;marker-end:url(#a)}</style><rect width="860" height="480" rx="22" fill="#f7faf9"/><text x="430" y="49" class="h">Backup perlu dibuktikan melalui pemulihan</text><rect x="50" y="110" width="270" height="90" rx="15" fill="#deece6"/><text x="185" y="146" class="b">Aktif saat backup</text><text x="185" y="177" class="s">total = 2</text><rect x="540" y="110" width="270" height="90" rx="15" fill="#e5e5f2"/><text x="675" y="146" class="b">File backup</text><text x="675" y="177" class="s">total = 2</text><path class="line" d="M325 155H533"/><text x="430" y="138" class="s">SQLite backup API</text><path class="line" d="M185 203V278"/><text x="307" y="249" class="s">data berubah</text><path class="line" d="M675 203V278"/><rect x="50" y="285" width="270" height="90" rx="15" fill="#f0e7dc"/><text x="185" y="321" class="b">Aktif sesudah perubahan</text><text x="185" y="352" class="s">total = 99, tetap utuh</text><rect x="540" y="285" width="270" height="90" rx="15" fill="#deece6"/><text x="675" y="321" class="b">Pemulihan ke file baru</text><text x="675" y="352" class="s">total = 2</text><text x="430" y="430" class="s">Periksa integrity_check dan isi laporan. File aktif belum diganti.</text><text x="430" y="459" class="s">Perubahan setelah backup tidak otomatis ada pada hasil pemulihan.</text></svg>
