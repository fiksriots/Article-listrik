<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" role="img" aria-labelledby="title desc"><title id="title">Kode, image, dan proses yang berjalan</title><desc id="desc">Dockerfile memberi petunjuk build; container menjalankan hasilnya.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#65508a"/></marker></defs><rect width="860" height="480" rx="18" fill="#f7f6f2"/><text x="36" y="48" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#263d38">Kode, image, dan proses yang berjalan</text><text x="36" y="82" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#263d38">Dockerfile memberi petunjuk build; container menjalankan hasilnya.</text><rect x="36" y="135" width="235" height="160" rx="12" fill="#ffffff" stroke="#b5c7be" stroke-width="2"/><text x="54" y="170" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263d38">Kode + Dockerfile</text><text x="54" y="204" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">Build dengan konteks</text><text x="54" y="232" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">yang ditentukan</text><rect x="312" y="135" width="235" height="160" rx="12" fill="#ffffff" stroke="#b5c7be" stroke-width="2"/><text x="330" y="170" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263d38">Image</text><text x="330" y="204" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">Artefak versi tertentu</text><text x="330" y="232" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">Belum proses aktif</text><rect x="588" y="135" width="235" height="160" rx="12" fill="#ffffff" stroke="#b5c7be" stroke-width="2"/><text x="606" y="170" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263d38">Container</text><text x="606" y="204" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">Proses dari image</text><text x="606" y="232" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">Konfigurasi runtime</text><path d="M275 215L306 215" fill="none" stroke="#65508a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M551 215L582 215" fill="none" stroke="#65508a" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="170" y="345" width="520" height="65" rx="12" fill="#e4ede7" stroke="#b5c7be" stroke-width="2"/><text x="188" y="380" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263d38">Data persisten memakai penyimpanan runtime.</text></svg>