<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" role="img" aria-labelledby="title desc"><title id="title">Reservasi stok dan kode permintaan</title><desc id="desc">Dalam transaksi, kode yang sudah ada dengan isi sama tidak diterapkan ulang. Kode baru memerlukan stok cukup dan catatan yang berhasil; kegagalan menyebabkan rollback.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#65508a"/></marker></defs><rect width="860" height="480" rx="20" fill="#faf6f1"/><g font-family="Arial,sans-serif" fill="#27334a"><text x="35" y="44" font-size="22" font-weight="bold">Satu kode, satu penerapan operasi</text><rect x="295" y="77" width="270" height="68" rx="12" fill="#f0ecf8" stroke="#65508a"/><text x="430" y="117" text-anchor="middle" font-size="20" font-weight="bold">BEGIN IMMEDIATE</text><path d="M430 145V178" stroke="#65508a" stroke-width="2" marker-end="url(#a)"/><rect x="280" y="185" width="300" height="60" rx="12" fill="white" stroke="#65508a"/><text x="430" y="222" text-anchor="middle" font-size="19">Periksa kode permintaan</text><path d="M280 215H180V282M580 215H680V282" fill="none" stroke="#65508a" stroke-width="2" marker-end="url(#a)"/><text x="180" y="267" text-anchor="middle" font-size="16">Sudah ada, isi sama</text><text x="680" y="267" text-anchor="middle" font-size="16">Kode baru</text><rect x="35" y="290" width="290" height="92" rx="12" fill="#edf5f7" stroke="#32718a"/><text x="180" y="325" text-anchor="middle" font-size="18">COMMIT, tanpa perubahan</text><text x="180" y="355" text-anchor="middle" font-size="16">Tidak mengurangi stok lagi.</text><rect x="520" y="290" width="305" height="92" rx="12" fill="#edf5f7" stroke="#32718a"/><text x="672" y="325" text-anchor="middle" font-size="18">Kurangi stok + catat operasi</text><text x="672" y="355" text-anchor="middle" font-size="16">Keduanya berhasil → COMMIT</text><text x="430" y="433" text-anchor="middle" font-size="17">Isi berbeda, stok kurang, atau catatan gagal → ROLLBACK.</text><text x="430" y="461" text-anchor="middle" font-size="16">Penanganan pesan eksternal memerlukan rancangan tersendiri.</text></g></svg>
