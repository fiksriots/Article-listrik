<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" role="img" aria-labelledby="title"><title id="title">Apa yang dibuktikan pengujian?</title><rect width="860" height="480" rx="24" fill="#f3f7f4"/><g font-family="Arial,sans-serif" fill="#193d37"><text x="38" y="58" font-size="27" font-weight="700">Apa yang dibuktikan pengujian?</text><text x="38" y="91" font-size="17">Formulir layanan fiktif</text><rect x="38" y="137" width="250" height="216" rx="14" fill="white" stroke="#bdd3c8"/><text x="54" y="180" font-size="18" font-weight="700">Demo publik</text><text x="54" y="234" font-size="14">Browser → memori halaman</text><text x="54" y="282" font-size="14">Reload menghapus data</text><rect x="304" y="137" width="250" height="216" rx="14" fill="white" stroke="#bdd3c8"/><text x="320" y="180" font-size="18" font-weight="700">API lokal</text><text x="320" y="234" font-size="14">Browser → HTTP → server</text><text x="320" y="282" font-size="14">Reload tetap; restart menghapus</text><rect x="570" y="137" width="250" height="216" rx="14" fill="white" stroke="#bdd3c8"/><text x="586" y="180" font-size="18" font-weight="700">Mock 503</text><text x="586" y="234" font-size="14">Browser → respons simulasi</text><text x="586" y="282" font-size="14">Memeriksa pesan gagal di UI</text><text x="38" y="416" font-size="17">Unit, integrasi, dan browser memeriksa batas yang berbeda.</text></g></svg>