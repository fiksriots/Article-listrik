<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" role="img" aria-labelledby="title desc"><title id="title">Dua loop membentuk enam pasangan</title><desc id="desc">Untuk setiap rak, semua slot diproses dari awal.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#65508a"/></marker></defs><rect width="860" height="480" rx="18" fill="#f7f6f2"/><text x="36" y="48" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#263d38">Dua loop membentuk enam pasangan</text><text x="36" y="82" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#263d38">Untuk setiap rak, semua slot diproses dari awal.</text><rect x="36.0" y="140" width="197.0" height="70" fill="#e4ede7" stroke="#b5c7be"/><text x="50.0" y="174" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#263d38">Rak / slot</text><rect x="233.0" y="140" width="197.0" height="70" fill="#e4ede7" stroke="#b5c7be"/><text x="247.0" y="174" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#263d38">Slot 1</text><rect x="430.0" y="140" width="197.0" height="70" fill="#e4ede7" stroke="#b5c7be"/><text x="444.0" y="174" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#263d38">Slot 2</text><rect x="627.0" y="140" width="197.0" height="70" fill="#e4ede7" stroke="#b5c7be"/><text x="641.0" y="174" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#263d38">Slot 3</text><rect x="36.0" y="210" width="197.0" height="70" fill="#ffffff" stroke="#b5c7be"/><text x="50.0" y="244" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#263d38">A</text><rect x="233.0" y="210" width="197.0" height="70" fill="#ffffff" stroke="#b5c7be"/><text x="247.0" y="244" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#263d38">A1</text><rect x="430.0" y="210" width="197.0" height="70" fill="#ffffff" stroke="#b5c7be"/><text x="444.0" y="244" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#263d38">A2</text><rect x="627.0" y="210" width="197.0" height="70" fill="#ffffff" stroke="#b5c7be"/><text x="641.0" y="244" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#263d38">A3</text><rect x="36.0" y="280" width="197.0" height="70" fill="#ffffff" stroke="#b5c7be"/><text x="50.0" y="314" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#263d38">B</text><rect x="233.0" y="280" width="197.0" height="70" fill="#ffffff" stroke="#b5c7be"/><text x="247.0" y="314" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#263d38">B1</text><rect x="430.0" y="280" width="197.0" height="70" fill="#ffffff" stroke="#b5c7be"/><text x="444.0" y="314" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#263d38">B2</text><rect x="627.0" y="280" width="197.0" height="70" fill="#ffffff" stroke="#b5c7be"/><text x="641.0" y="314" font-family="Arial,sans-serif" font-size="20" font-weight="400" fill="#263d38">B3</text><text x="36" y="449" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#263d38">Urutan: A1 → A2 → A3 → B1 → B2 → B3. Total 2 × 3 = 6.</text></svg>