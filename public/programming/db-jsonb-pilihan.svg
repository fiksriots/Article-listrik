<svg xmlns="http://www.w3.org/2000/svg" width="860" height="500" viewBox="0 0 860 500" role="img" aria-labelledby="title desc">
<title id="title">Gabungan kolom relasional dan JSONB</title><desc id="desc">Satu pembacaan telemetri memiliki id, perangkat dan waktu pada kolom tetap. Payload JSONB memuat atribut sensor yang bervariasi, dengan aturan tipe pada tegangan.</desc>
<rect width="860" height="500" rx="22" fill="#f5f4fa"/>
<g font-family="Arial, sans-serif" fill="#25322e">
<text x="40" y="50" font-size="26" font-weight="700">Satu pembacaan, dua bentuk data</text>
<text x="40" y="82" font-size="18">Pilih bentuk berdasarkan aturan dan pola pemakaian.</text>
<rect x="40" y="112" width="365" height="268" rx="14" fill="#fff" stroke="#b6cec3" stroke-width="2"/>
<rect x="435" y="112" width="385" height="268" rx="14" fill="#fff" stroke="#c7bfe2" stroke-width="2"/>
<text x="65" y="148" font-size="22" font-weight="700">Kolom relasional</text>
<text x="65" y="179" font-size="17">Identitas dan struktur yang stabil</text>
<path d="M65 198 H380" stroke="#dbe4df"/>
<text x="65" y="233" font-family="monospace" font-size="19">id: 1</text>
<text x="65" y="267" font-family="monospace" font-size="19">perangkat_id: BTS-A</text>
<text x="65" y="301" font-family="monospace" font-size="19">dicatat: waktu pembacaan</text>
<text x="65" y="349" font-size="17">Primary key · foreign key · tipe</text>
<text x="460" y="148" font-size="22" font-weight="700">Payload JSONB</text>
<text x="460" y="179" font-size="17">Atribut tambahan yang bervariasi</text>
<path d="M460 198 H795" stroke="#e1dced"/>
<g font-family="monospace" font-size="19"><text x="460" y="229">{</text><text x="480" y="259">&quot;tegangan&quot;: 12.4,</text><text x="480" y="289">&quot;mode&quot;: &quot;baterai&quot;,</text><text x="480" y="319">&quot;suhu&quot;: 31</text><text x="460" y="349">}</text></g>
<rect x="40" y="402" width="780" height="64" rx="12" fill="#e5eee8"/>
<text x="60" y="429" font-size="18" font-weight="700">Fleksibel tetap membutuhkan aturan.</text>
<text x="60" y="453" font-size="17">CHECK memeriksa bentuk dan tipe; aturan bisnis melengkapi validasi.</text>
</g></svg>
