<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulir tiket lokal</title>
  <style>*{box-sizing:border-box}body{font:16px/1.65 system-ui,sans-serif;color:#243343;background:#f5f6fa;margin:0}main,header,footer{max-width:960px;margin:auto;padding:24px}main{background:white;border-radius:16px;margin:24px auto}h1,h2{line-height:1.25}a{color:#5143a6}button,input,select{font:inherit}button{background:#5143a6;color:white;border:0;border-radius:8px;padding:10px 16px;cursor:pointer}input,select{padding:9px;border:1px solid #8993a1;border-radius:6px;max-width:100%}label{display:block;margin:14px 0 5px}:focus-visible{outline:3px solid #a05b15;outline-offset:3px}p[role=status]{min-height:1.65em}ul{padding-left:24px}@media(max-width:1000px){main{margin:16px}}
</style>
  
</head>
<body>
<main><h1>Simulasi formulir tiket</h1>
<p>Demo memeriksa input di browser dan tidak mengirim tiket ke server.</p>
<form id="tiket">
  <label for="judul">Judul gangguan</label><input id="judul" name="judul" required maxlength="120" autocomplete="off">
  <label for="email">Email pelapor</label><input id="email" name="email" type="email" required autocomplete="email">
  <label for="prioritas">Prioritas</label><select id="prioritas" name="prioritas"><option value="normal">Normal</option><option value="tinggi">Tinggi</option></select>
  <p><button type="submit">Periksa input</button></p>
</form><p id="hasil" role="status"></p></main>
<script>
const form = document.querySelector('#tiket');
form.addEventListener('submit', (event) => {
  event.preventDefault(); // Demo lokal: tidak ada request POST.
  const judul = form.elements.namedItem('judul');
  if (!judul.value.trim()) {
    judul.setCustomValidity('Judul tidak boleh hanya berisi spasi.');
    judul.reportValidity();
    return;
  }
  document.querySelector('#hasil').textContent = 'Input lolos pemeriksaan browser. Belum dikirim ke server.';
});
document.querySelector('#judul').addEventListener('input', (event) => {
  event.target.setCustomValidity('');
});
</script>
</body>
</html>
