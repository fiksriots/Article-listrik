<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Membaca API direktori belajar</title>
  <style>*{box-sizing:border-box}body{font:16px/1.65 system-ui,sans-serif;color:#243343;background:#f5f6fa;margin:0}main,header,footer{max-width:960px;margin:auto;padding:24px}main{background:white;border-radius:16px;margin:24px auto}h1,h2{line-height:1.25}a{color:#5143a6}button,input,select{font:inherit}button{background:#5143a6;color:white;border:0;border-radius:8px;padding:10px 16px;cursor:pointer}input,select{padding:9px;border:1px solid #8993a1;border-radius:6px;max-width:100%}label{display:block;margin:14px 0 5px}:focus-visible{outline:3px solid #a05b15;outline-offset:3px}p[role=status]{min-height:1.65em}ul{padding-left:24px}@media(max-width:1000px){main{margin:16px}}
</style>
  
</head>
<body>
<main><h1>Jalur Learn Programming</h1>
<p>Contoh membaca API publik situs belajar, termasuk dari server lokal.</p>
<button id="muat" type="button">Muat jalur</button>
<p id="status" role="status">Belum dimuat.</p><ul id="jalur"></ul></main>
<script>
const tombol = document.querySelector('#muat');
const status = document.querySelector('#status');
const daftar = document.querySelector('#jalur');
tombol.addEventListener('click', async () => {
  tombol.disabled = true;
  daftar.replaceChildren();
  status.textContent = 'Memuat…';
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 8000);
  try {
    const response = await fetch('https://article.fikss.site/api/learning-paths', {signal: controller.signal});
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    if (data.schemaVersion !== 1 || !Array.isArray(data.groups)) throw new Error('Kontrak tidak sesuai');
    const group = data.groups.find(item => item.id === 'programming');
    if (!group || !Array.isArray(group.categories) || group.categories.length > 100 ||
        !group.categories.every(item => typeof item.name === 'string' && item.name.length <= 200)) {
      throw new Error('Daftar tidak sesuai');
    }
    for (const category of group.categories) {
      const item = document.createElement('li');
      item.textContent = category.name;
      daftar.append(item);
    }
    status.textContent = `${group.categories.length} jalur ditemukan.`;
  } catch (error) {
    status.textContent = error.name === 'AbortError' ? 'Waktu tunggu habis. Coba lagi.' : 'Data belum dapat dimuat. Coba lagi.';
  } finally {
    clearTimeout(timer);
    tombol.disabled = false;
  }
});
</script>
</body>
</html>
