<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Modul JavaScript</title><style>*{box-sizing:border-box}body{font:16px/1.65 system-ui,sans-serif;color:#243343;background:#f5f6fa;margin:0}main,header,footer{max-width:960px;margin:auto;padding:24px}main{background:white;border-radius:16px;margin:24px auto}h1,h2{line-height:1.25}a{color:#5143a6}button,input,select{font:inherit}button{background:#5143a6;color:white;border:0;border-radius:8px;padding:10px 16px;cursor:pointer}input,select{padding:9px;border:1px solid #8993a1;border-radius:6px;max-width:100%}label{display:block;margin:14px 0 5px}:focus-visible{outline:3px solid #a05b15;outline-offset:3px}p[role=status]{min-height:1.65em}ul{padding-left:24px}@media(max-width:1000px){main{margin:16px}}</style></head>
<body><main><h1>Ringkasan inventaris</h1><p>Dua modul lokal membagi logika perhitungan dan interaksi DOM.</p>
<form id="form"><label for="nama">Nama perangkat</label><input id="nama" required maxlength="80"><label for="jumlah">Jumlah</label><input id="jumlah" type="number" min="1" max="100" step="1" value="1" required><p><button type="submit">Buat ringkasan</button></p></form><p id="status" role="status"></p></main>
<script type="module" src="./web-modul-app.mjs"></script>
</body></html>
