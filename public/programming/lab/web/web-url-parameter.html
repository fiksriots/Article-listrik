<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Filter melalui URL</title><style>*{box-sizing:border-box}body{font:16px/1.65 system-ui,sans-serif;color:#243343;background:#f5f6fa;margin:0}main,header,footer{max-width:960px;margin:auto;padding:24px}main{background:white;border-radius:16px;margin:24px auto}h1,h2{line-height:1.25}a{color:#5143a6}button,input,select{font:inherit}button{background:#5143a6;color:white;border:0;border-radius:8px;padding:10px 16px;cursor:pointer}input,select{padding:9px;border:1px solid #8993a1;border-radius:6px;max-width:100%}label{display:block;margin:14px 0 5px}:focus-visible{outline:3px solid #a05b15;outline-offset:3px}p[role=status]{min-height:1.65em}ul{padding-left:24px}@media(max-width:1000px){main{margin:16px}}</style></head>
<body><main><h1>Cari materi latihan</h1><p>URL menyimpan kata pencarian nonrahasia. Muat ulang untuk memulihkan filter.</p><form id="form"><label for="q">Kata pencarian</label><input id="q" maxlength="80"><p><button type="submit">Terapkan filter</button></p></form><p id="status" role="status"></p><ul id="hasil"></ul></main>
<script type="module">
const materi = ['Python dasar', 'Django template', 'HTML semantik', 'JavaScript DOM'];
const input = document.querySelector('#q');
const status = document.querySelector('#status');
const daftar = document.querySelector('#hasil');
function tampilkan(kata) {
  const hasil = materi.filter(nama => nama.toLowerCase().includes(kata.toLowerCase()));
  daftar.replaceChildren();
  for (const nama of hasil) {
    const li = document.createElement('li');
    li.textContent = nama;
    daftar.append(li);
  }
  status.textContent = `${hasil.length} materi ditemukan.`;
}
const awal = new URL(location.href).searchParams.get('q') ?? '';
input.value = awal.slice(0, 80);
tampilkan(input.value);
document.querySelector('#form').addEventListener('submit', event => {
  event.preventDefault();
  const kata = input.value.trim().slice(0, 80);
  input.value = kata;
  const url = new URL(location.href);
  if (kata) url.searchParams.set('q', kata);
  else url.searchParams.delete('q');
  history.replaceState(null, '', url);
  tampilkan(kata);
});
</script>
</body></html>
