<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Katalog responsif</title>
  <style>*{box-sizing:border-box}body{font:16px/1.65 system-ui,sans-serif;color:#243343;background:#f5f6fa;margin:0}main,header,footer{max-width:960px;margin:auto;padding:24px}main{background:white;border-radius:16px;margin:24px auto}h1,h2{line-height:1.25}a{color:#5143a6}button,input,select{font:inherit}button{background:#5143a6;color:white;border:0;border-radius:8px;padding:10px 16px;cursor:pointer}input,select{padding:9px;border:1px solid #8993a1;border-radius:6px;max-width:100%}label{display:block;margin:14px 0 5px}:focus-visible{outline:3px solid #a05b15;outline-offset:3px}p[role=status]{min-height:1.65em}ul{padding-left:24px}@media(max-width:1000px){main{margin:16px}}
nav{display:flex;flex-wrap:wrap;gap:20px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.grid article{padding:20px;border:1px solid #d2d6df;border-radius:12px;min-width:0;overflow-wrap:anywhere}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style>
  
</head>
<body>
<header><nav aria-label="Navigasi"><a href="#materi">Materi</a><a href="#catatan">Catatan</a></nav></header>
<main><h1>Katalog belajar</h1>
<section id="materi" class="grid" aria-label="Daftar materi">
  <article><h2>HTML</h2><p>Susun isi dan makna halaman.</p></article>
  <article><h2>CSS</h2><p>Atur tampilan dan tata letak.</p></article>
  <article><h2>JavaScript</h2><p>Tambahkan perilaku interaktif.</p></article>
</section><p id="catatan">Perkecil jendela untuk mengamati susunan kolom.</p></main>

</body>
</html>
