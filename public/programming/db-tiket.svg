<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" role="img" aria-labelledby="title desc"><title id="title">Status dan riwayat diperbarui sebagai satu transaksi</title><desc id="desc">Teknisi dirujuk Tiket, satu Tiket mempunyai banyak Riwayat. UPDATE tiket dan INSERT riwayat harus berhasil bersama.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#65508a"/></marker></defs><rect width="860" height="480" rx="20" fill="#faf6f1"/><g font-family="Arial,sans-serif" fill="#27334a"><text x="35" y="44" font-size="22" font-weight="bold">Status dan riwayat diperbarui sebagai satu transaksi</text><rect x="30" y="115" width="235" height="115" rx="12" fill="#fff" stroke="#a18d7b"/><text x="48" y="147" font-size="21" font-weight="bold">Teknisi</text><text x="48" y="178" font-size="16">id, nama</text><text x="48" y="203" font-size="16">Petugas terdaftar</text><rect x="312" y="115" width="236" height="115" rx="12" fill="#f0ecf8" stroke="#a18d7b"/><text x="330" y="147" font-size="21" font-weight="bold">Tiket</text><text x="330" y="178" font-size="16">id, teknisi_id, status</text><text x="330" y="203" font-size="16">Status terkini</text><rect x="595" y="115" width="235" height="115" rx="12" fill="#fff" stroke="#a18d7b"/><text x="613" y="147" font-size="21" font-weight="bold">Riwayat</text><text x="613" y="178" font-size="16">id, tiket_id, status</text><text x="613" y="203" font-size="16">Urutan perubahan</text><path d="M265 172H302" fill="none" stroke="#65508a" stroke-width="2" marker-end="url(#a)"/><path d="M548 172H585" fill="none" stroke="#65508a" stroke-width="2" marker-end="url(#a)"/><text x="280" y="90" text-anchor="middle" font-size="17">1 : banyak</text><text x="571" y="90" text-anchor="middle" font-size="17">1 : banyak</text><rect x="85" y="300" width="690" height="110" rx="14" fill="#edf5f7" stroke="#32718a"/><text x="430" y="335" text-anchor="middle" font-size="17">BEGIN → UPDATE tiket + INSERT riwayat → COMMIT</text><text x="430" y="373" text-anchor="middle" font-size="17">Jika salah satu gagal: ROLLBACK seluruh unit pekerjaan.</text><text x="430" y="452" text-anchor="middle" font-size="17">Alur latihan: BARU → DIPROSES → SELESAI</text></g></svg>