<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" role="img" aria-labelledby="title desc"><title id="title">Satu class, dua instance</title><desc id="desc">Definisi sama; keadaan setiap instance dapat berbeda.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#65508a"/></marker></defs><rect width="860" height="480" rx="18" fill="#f7f6f2"/><text x="36" y="48" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#263d38">Satu class, dua instance</text><text x="36" y="82" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#263d38">Definisi sama; keadaan setiap instance dapat berbeda.</text><rect x="275" y="115" width="310" height="90" rx="12" fill="#ffffff" stroke="#b5c7be" stroke-width="2"/><text x="293" y="150" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263d38">Class Perangkat</text><text x="293" y="184" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">Mendefinisikan nama dan status</text><rect x="50" y="275" width="330" height="125" rx="12" fill="#ffffff" stroke="#b5c7be" stroke-width="2"/><text x="68" y="310" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263d38">Objek A</text><text x="68" y="344" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">nama: Araya</text><text x="68" y="372" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">status: up</text><rect x="480" y="275" width="330" height="125" rx="12" fill="#ffffff" stroke="#b5c7be" stroke-width="2"/><text x="498" y="310" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263d38">Objek B</text><text x="498" y="344" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">nama: Keputih</text><text x="498" y="372" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">status: down</text><path d="M340 210L215 269" fill="none" stroke="#65508a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M520 210L645 269" fill="none" stroke="#65508a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="36" y="449" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#263d38">b = a memberi nama kedua pada objek yang sama, bukan membuat instance baru.</text></svg>