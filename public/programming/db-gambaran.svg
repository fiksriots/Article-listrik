<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" role="img" aria-labelledby="title desc"><title id="title">Data, engine, dan program mempunyai tugas berbeda</title><desc id="desc">Program mengirim SQL ke engine SQLite. Engine mengelola tabel pelanggan dan tiket dalam database latihan.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#65508a"/></marker></defs><rect width="860" height="480" rx="20" fill="#faf6f1"/><g font-family="Arial,sans-serif" fill="#27334a"><text x="35" y="44" font-size="22" font-weight="bold">Data, engine, dan program mempunyai tugas berbeda</text><rect x="60" y="92" width="270" height="115" rx="12" fill="#fff" stroke="#a18d7b"/><text x="78" y="124" font-size="21" font-weight="bold">Program Python</text><text x="78" y="155" font-size="16">Mengirim kueri SQL</text><text x="78" y="180" font-size="16">Membaca hasil kueri</text><rect x="525" y="92" width="270" height="115" rx="12" fill="#fff" stroke="#a18d7b"/><text x="543" y="124" font-size="21" font-weight="bold">Engine SQLite</text><text x="543" y="155" font-size="16">Memeriksa pernyataan</text><text x="543" y="180" font-size="16">Mengelola transaksi</text><path d="M330 148H515" fill="none" stroke="#65508a" stroke-width="2" marker-end="url(#a)"/><text x="428" y="127" text-anchor="middle" font-size="17">SQL →</text><path d="M660 207V266H430V290" fill="none" stroke="#65508a" stroke-width="2" marker-end="url(#a)"/><rect x="135" y="295" width="590" height="135" rx="14" fill="#f0ecf8" stroke="#65508a"/><text x="430" y="327" text-anchor="middle" font-size="17">Database latihan</text><rect x="155" y="345" width="240" height="65" rx="12" fill="#fff" stroke="#a18d7b"/><text x="173" y="377" font-size="18" font-weight="bold">Pelanggan</text><text x="173" y="399" font-size="16">id, nama</text><rect x="465" y="345" width="240" height="65" rx="12" fill="#fff" stroke="#a18d7b"/><t