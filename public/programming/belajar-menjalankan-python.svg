<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" role="img" aria-labelledby="title desc"><title id="title">Dari file menjadi keluaran</title><desc id="desc">Editor, terminal, dan hasil memiliki tugas yang berbeda.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#65508a"/></marker></defs><rect width="860" height="480" rx="18" fill="#f7f6f2"/><text x="36" y="48" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#263d38">Dari file menjadi keluaran</text><text x="36" y="82" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#263d38">Editor, terminal, dan hasil memiliki tugas yang berbeda.</text><rect x="36" y="140" width="235" height="190" rx="12" fill="#ffffff" stroke="#b5c7be" stroke-width="2"/><text x="54" y="175" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263d38">1 · Editor</text><text x="54" y="209" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">Simpan latihan.py</text><text x="54" y="237" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">print(&quot;Halo&quot;)</text><rect x="312" y="140" width="235" height="190" rx="12" fill="#ffffff" stroke="#b5c7be" stroke-width="2"/><text x="330" y="175" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263d38">2 · Terminal</text><text x="330" y="209" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">Buka folder latihan</text><text x="330" y="237" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">python latihan.py</text><rect x="588" y="140" width="235" height="190" rx="12" fill="#ffffff" stroke="#b5c7be" stroke-width="2"/><text x="606" y="175" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263d38">3 · Keluaran</text><text x="606" y="209" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">Python membaca file</text><text x="606" y="237" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">Layar menampilkan Halo</text><path d="M275 240L306 240" fill="none" stroke="#65508a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M551 240L582 240" fill="none" stroke="#65508a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="36" y="449" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#263d38">Simpan perubahan, lalu jalankan ulang file yang sama.</text></svg>