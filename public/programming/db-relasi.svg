<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" role="img" aria-labelledby="title desc"><title id="title">Relasi mengikuti jumlah dan kebutuhan data</title><desc id="desc">Teknisi satu ke banyak Tiket. Peserta banyak ke banyak Kelas melalui tabel PesertaKelas.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#65508a"/></marker></defs><rect width="860" height="480" rx="20" fill="#faf6f1"/><g font-family="Arial,sans-serif" fill="#27334a"><text x="35" y="44" font-size="22" font-weight="bold">Relasi mengikuti jumlah dan kebutuhan data</text><rect x="60" y="85" width="270" height="115" rx="12" fill="#fff" stroke="#a18d7b"/><text x="78" y="117" font-size="21" font-weight="bold">Teknisi</text><text x="78" y="148" font-size="16">id (primary key)</text><text x="78" y="173" font-size="16">nama</text><rect x="525" y="85" width="270" height="115" rx="12" fill="#fff" stroke="#a18d7b"/><text x="543" y="117" font-size="21" font-weight="bold">Tiket</text><text x="543" y="148" font-size="16">id (primary key)</text><text x="543" y="173" font-size="16">teknisi_id (foreign key)</text><path d="M330 142H515" fill="none" stroke="#65508a" stroke-width="2" marker-end="url(#a)"/><text x="427" y="119" text-anchor="middle" font-size="17">1 → banyak</text><rect x="30" y="290" width="235" height="115" rx="12" fill="#fff" stroke="#a18d7b"/><text x="48" y="322" font-size="21" font-weight="bold">Peserta</text><text x="48" y="353" font-size="16">id (primary key)</text><rect x="310" y="290" width="240" height="115" rx="12" fill="#fff" stroke="#a18d7b"/><text x="328" y="322" font-size="21" font-weight="bold">PesertaKelas</text><text x="328" y="353" font-size="16">peserta_id, kelas_id</text><text x="328" y="378" font-size="16">kunci gabungan</text><rect x="595" y="290" width="235" height="115" rx="12" fill="#fff" stroke="#a18d7b"/><text x="613" y="322" font-size="21" font-weight="bold">Kelas</text><text x="613" y="353" font-size="16">id (primary key)</text><path d="M265 346H300" fill="none" stroke="#65508a" stroke-width="2" marker-end="url(#a)"/><path d="M595 346H560" fill="none" stroke="#65508a" stroke-width="2" marker-end="url(#a)"/><text x="430" y="248" text-anchor="middle" font-size="17">Banyak-ke-banyak memakai tabel penghubung.</text><text x="430" y="450" text-anchor="middle" font-size="17">Setiap pasangan peserta dan kelas dicatat sekali.</text></g></svg>