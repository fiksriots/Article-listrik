<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" role="img" aria-labelledby="title desc"><title id="title">Alur Data Analysis</title><desc id="desc">Tetapkan pertanyaan, periksa kualitas data, olah serta visualisasikan, lalu laporkan temuan beserta batasnya.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#658896"/></marker></defs><rect width="860" height="480" rx="24" fill="#eef4fa"/><g font-family="system-ui,sans-serif" text-anchor="middle" fill="#263b55"><text x="430" y="48" font-size="24" font-weight="700">Angka perlu pertanyaan dan konteks</text><g stroke="#658896" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M370 153H485"/><path d="M652 210V266"/><path d="M490 322H375"/></g><rect x="40" y="96" width="330" height="114" rx="16" fill="white"/><text x="205" y="135" font-size="22" font-weight="700">1. Pertanyaan</text><text x="205" y="169" font-size="18">Unit, periode, satuan, tujuan</text><text x="205" y="193" font-size="15">Apa yang ingin diketahui?</text><rect x="490" y="96" width="330" height="114" rx="16" fill="#dbe9f6"/><text x="655" y="135" font-size="22" font-weight="700">2. Periksa data</text><text x="655" y="169" font-size="18">Tipe, missing, duplikat, relasi</text><text x="655" y="193" font-size="15">Mana yang dapat dipercaya?</text><rect x="490" y="266" width="330" height="114" rx="16" fill="#e7e2f4"/><text x="655" y="305" font-size="20" font-weight="700">3. Olah dan visualisasikan</text><text x="655" y="339" font-size="18">Filter, agregasi, join, grafik</text><text x="655" y="363" font-size="15">Penyebut dan skala harus jelas</text><rect x="40" y="266" width="330" height="114" rx="16" fill="#dceee7"/><text x="205" y="305" font-size="22" font-weight="700">4. Laporkan</text><text x="205" y="339" font-size="18">Temuan, batas, tindak lanjut</text><text x="205" y="363" font-size="15">Bedakan fakta dan interpretasi</text><text x="430" y="438" font-size="18">Simpan data mentah dan catatan proses agar hasil dapat ditelusuri.</text></g></svg>
