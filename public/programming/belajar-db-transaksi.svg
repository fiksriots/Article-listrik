<svg xmlns="http://www.w3.org/2000/svg" width="860" height="480" viewBox="0 0 860 480" role="img" aria-labelledby="title desc"><title id="title">Perubahan yang harus berhasil bersama</title><desc id="desc">Contoh: kurangi stok sekaligus catat mutasi barang.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#65508a"/></marker></defs><rect width="860" height="480" rx="18" fill="#f7f6f2"/><text x="36" y="48" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#263d38">Perubahan yang harus berhasil bersama</text><text x="36" y="82" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#263d38">Contoh: kurangi stok sekaligus catat mutasi barang.</text><rect x="36" y="145" width="235" height="160" rx="12" fill="#ffffff" stroke="#b5c7be" stroke-width="2"/><text x="54" y="180" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263d38">Mulai transaksi</text><text x="54" y="214" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">Kurangi stok</text><text x="54" y="242" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">Catat mutasi</text><rect x="312" y="145" width="235" height="160" rx="12" fill="#ffffff" stroke="#b5c7be" stroke-width="2"/><text x="330" y="180" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263d38">Semua berhasil?</text><text x="330" y="214" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">Ya → commit</text><text x="330" y="242" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">Tidak → rollback</text><rect x="588" y="145" width="235" height="160" rx="12" fill="#ffffff" stroke="#b5c7be" stroke-width="2"/><text x="606" y="180" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263d38">Keadaan akhir</text><text x="606" y="214" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">Commit: keduanya ada</text><text x="606" y="242" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#263d38">Rollback: dibatalkan</text><path d="M275 225L306 225" fill="none" stroke="#65508a" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M551 225L582 225" fill="none" stroke="#65508a" stroke-width="2.5" marker-end="url(#arrow)"/><text x="36" y="449" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#263d38">Rollback membatalkan perubahan transaksi yang belum di-commit.</text></svg>