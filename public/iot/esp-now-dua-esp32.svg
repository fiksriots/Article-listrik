<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" role="img" aria-labelledby="title desc"><title id="title">ESP-NOW: komunikasi langsung antarboard</title><desc id="desc">Dua ESP32 memakai channel yang sama; tidak melewati broker pada latihan ini.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#71678f"/></marker></defs><rect width="820" height="500" rx="22" fill="#f5f3f9"/><g font-family="Arial,sans-serif"><text x="28" y="36" font-size="21" fill="#202c49" font-weight="700">ESP-NOW: komunikasi langsung antarboard</text><text x="28" y="64" font-size="13" fill="#5b6379">Dua ESP32 memakai channel yang sama; tidak melewati broker pada latihan ini.</text><rect x="35" y="115" width="235" height="150" rx="13" fill="#fff" stroke="#cfc9dd"/><text x="49" y="143" font-size="16" fill="#202c49" font-weight="700">ESP32 pengirim</text><text x="49" y="172" font-size="12" fill="#5b6379">MAC tujuan = MAC STA penerima ·</text><text x="49" y="190" font-size="12" fill="#5b6379">channel 6</text><rect x="550" y="115" width="235" height="150" rx="13" fill="#fff" stroke="#cfc9dd"/><text x="564" y="143" font-size="16" fill="#202c49" font-weight="700">ESP32 penerima</text><text x="564" y="172" font-size="12" fill="#5b6379">Periksa panjang dan magic →</text><text x="564" y="190" font-size="12" fill="#5b6379">masukkan antrean</text><path d="M270 180 H546" fill="none" stroke="#71678f" stroke-width="2.4" marker-end="url(#arrow)"/><text x="335" y="158" font-size="12" fill="#71678f">Paket 12 byte</text><text x="312" y="207" font-size="13" fill="#5b6379">sequence + suhu ×100</text><rect x="35" y="320" width="235" height="95" rx="13" fill="#fff" stroke="#cfc9dd"/><text x="49" y="348" font-size="16" fill="#202c49" font-weight="700">Status antrean kirim</text><text x="49" y="377" font-size="12" fill="#5b6379">ESP_OK belum membuktikan</text><text x="49" y="395" font-size="12" fill="#5b6379">aplikasi menerima.</text><rect x="550" y="320" width="235" height="95" rx="13" fill="#fff" stroke="#cfc9dd"/><text x="564" y="348" font-size="16" fill="#202c49" font-weight="700">Loop dan Serial</text><text x="564" y="377" font-size="12" fill="#5b6379">Sequence bertambah · 29.40 °C</text><text x="564" y="395" font-size="12" fill="#5b6379">simulasi</text><path d="M150 265 V316" fill="none" stroke="#71678f" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M665 265 V316" fill="none" stroke="#71678f" stroke-width="2.4" marker-end="url(#arrow)"/><text x="28" y="470" font-size="12" fill="#5b6379">Tanpa enkripsi untuk data lab · untuk penerapan nyata, rancang peer tepercaya, kunci, dan ACK aplikasi.</text></g></svg>
