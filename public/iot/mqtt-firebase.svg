t-weight="700" fill="#202c49">Python bridge</text><text x="570" y="166" font-size="13" fill="#5b6379">SUBSCRIBE + validasi</text><rect x="555" y="247" width="225" height="90" rx="14" fill="white" stroke="#c9c7dd"/><text x="570" y="271" font-size="12" font-weight="700" fill="#6366a5">04</text><text x="570" y="295" font-size="17" font-weight="700" fill="#202c49">Firebase Realtime DB</text><text x="570" y="318" font-size="13" fill="#5b6379">HTTPS · tulis latest</text><rect x="295" y="247" width="225" height="90" rx="14" fill="white" stroke="#c9c7dd"/><text x="310" y="271" font-size="12" font-weight="700" fill="#6366a5">05</text><text x="310" y="295" font-size="17" font-weight="700" fill="#202c49">Dashboard web</text><text x="310" y="318" font-size="13" fill="#5b6379">SDK web · baca setelah login</text><text x="30" y="371" font-size="13" fill="#5b6379">Komputer bridge harus tetap menyala; kunci privat hanya berada di server.</text><text x="30" y="393" font-size="13" fill="#5b6379">latest menyimpan nilai terbaru, bukan riwayat semua pengukuran.</text></g></svg>
