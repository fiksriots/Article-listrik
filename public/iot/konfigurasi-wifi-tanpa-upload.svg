fill="#202c49" font-weight="700">POST dan simpan NVS</text><text x="584" y="382" font-size="12" fill="#5b6379">Validasi isian serta token</text><text x="584" y="400" font-size="12" fill="#5b6379">form</text><rect x="300" y="325" width="220" height="105" rx="13" fill="#fff" stroke="#cfc9dd"/><text x="314" y="353" font-size="16" fill="#202c49" font-weight="700">Restart → station</text><text x="314" y="382" font-size="12" fill="#5b6379">Uji Wi-Fi; MQTT belum berjalan</text><path d="M680 230V321" fill="none" stroke="#71678f" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M570 377H524" fill="none" stroke="#71678f" stroke-width="2.4" marker-end="url(#arrow)"/><text x="28" y="470" font-size="12" fill="#5b6379">Jika konfigurasi salah: tahan tombol setup ke GND saat boot. HTTP lab bukan HTTPS.</text></g></svg>
