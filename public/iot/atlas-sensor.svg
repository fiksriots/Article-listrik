<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Kenali bentuk sensor</title><desc id="desc">Enam ilustrasi sensor: DHT22, ultrasonik, PIR, LDR, probe suhu, dan reed switch. Skema bentuk tanpa petunjuk sambungan.</desc><rect width="900" height="520" rx="24" fill="#f0f3ff"/><g font-family="sans-serif" fill="#202c49"><text x="32" y="43" font-size="23" font-weight="600">Bentuk berbeda, tugas berbeda.</text><g stroke="#cbd5e1" fill="white"><rect x="25" y="65" width="270" height="195" rx="14"/><rect x="315" y="65" width="270" height="195" rx="14"/><rect x="605" y="65" width="270" height="195" rx="14"/><rect x="25" y="278" width="270" height="195" rx="14"/><rect x="315" y="278" width="270" height="195" rx="14"/><rect x="605" y="278" width="270" height="195" rx="14"/></g><g stroke="#64748b" stroke-width="3"><path d="M135 165v22m17-22v22m17-22v22m17-22v22"/><rect x="120" y="85" width="80" height="85" rx="7" fill="#f8fafc"/><path d="M131 99h58m-58 14h58m-58 14h58m-58 14h58m-58 14h58" stroke-width="5" stroke="#cbd5e1"/><rect x="355" y="110" width="190" height="60" rx="5" fill="#417a75" stroke="#335f5b"/><circle cx="397" cy="138" r="30" fill="#e2e8f0"/><circle cx="503" cy="138" r="30" fill="#e2e8f0"/><circle cx="397" cy="138" r="21" fill="#64748b"/><circle cx="503" cy="138" r="21" fill="#64748b"/><rect x="704" y="118" width="75" height="60" rx="5" fill="#417a75"/><path d="M707 125a35 35 0 0 1 70 0Z" fill="#f1f5f9"/><path d="M719 120a22 22 0 0 1 44 0m-32 0a10 10 0 0 1 20 0" fill="none" stroke="#cbd5e1"/><path d="M145 363v35m30-35v35"/><circle cx="160" cy="343" r="34" fill="#dbac74" stroke="#b78a58"/><path d="M142 326h27v11h-21v11h23v11h-28" fill="none" stroke="#8a6040"/><path d="M420 322v-20q0-12 24-12h30" fill="none" stroke="#334155" stroke-width="7"/><rect x="409" y="322" width="23" height="76" rx="9" fill="#cbd5e1"/><rect x="686" y="336" width="77" height="24" rx="12" fill="#e7e5e4" stroke="#a8a29e"/><path d="M657 348h46m43 0h46" fill="none"/><rect x="693" y="385" width="65" height="19" rx="4" fill="#64748b"/></g><g font-size="17" font-weight="600" text-anchor="middle"><text x="160" y="215">DHT22 / AM2302</text><text x="450" y="215">Ultrasonik</text><text x="740" y="215">PIR</text><text x="160" y="434">LDR</text><text x="450" y="434">Probe suhu</text><text x="740" y="434">Reed + magnet</text></g><g font-size="13" fill="#64748b" text-anchor="middle"><text x="160" y="239">Suhu dan kelembapan udara</text><text x="450" y="239">Jarak lewat pantulan suara</text><text x="740" y="239">Perubahan gerak termal</text><text x="160" y="457">Resistansi berubah oleh cahaya</text><text x="450" y="457">Bentuk probe, tipe sensor bervariasi</text><text x="740" y="457">Status kontak dipengaruhi magnet</text></g><text x="28" y="503" font-size="12" fill="#64748b">Ilustrasi edukasi · Bentuk disederhanakan, bukan skala sebenarnya atau petunjuk pin.</text></g></svg>
