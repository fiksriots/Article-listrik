<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" role="img" aria-labelledby="title desc">
<title id="title">Peta proyek PlatformIO</title><desc id="desc">Folder proyek berisi konfigurasi platformio.ini dan src/main.cpp. Build menghasilkan firmware, upload mengirimnya ke board, monitor membaca pesan serial.</desc>
<rect width="820" height="420" rx="24" fill="#0f172a"/>
<g font-family="Consolas,monospace"><text x="32" y="43" fill="#5eead4" font-size="23">PlatformIO · dari source ke perangkat</text><text x="32" y="70" fill="#cbd5e1" font-size="14">Ilustrasi konsep — bukan tampilan aplikasi</text>
<rect x="28" y="96" width="338" height="268" rx="14" fill="#1e293b" stroke="#475569"/><text x="48" y="129" fill="#f8fafc" font-size="19">01 / Folder proyek</text><text x="48" y="171" fill="#5eead4" font-size="18">platformio.ini</text><text x="48" y="194" fill="#cbd5e1" font-size="14">board · framework · library</text><text x="48" y="235" fill="#5eead4" font-size="18">src/main.cpp</text><text x="48" y="258" fill="#cbd5e1" font-size="14">setup() · loop() · fungsi</text><text x="48" y="303" fill="#cbd5e1" font-size="15">include/ · lib/ · test/</text><text x="48" y="334" fill="#94a3b8" font-size="13">.pio/ = hasil kerja otomatis</text>
<path d="M366 161 H423 M423 155 L432 161 L423 167" fill="none" stroke="#5eead4" stroke-width="3"/>
<rect x="440" y="96" width="350" height="80" rx="12" fill="#134e4a"/><text x="458" y="126" fill="#f0fdfa" font-size="19">02 / Build → firmware</text><text x="458" y="154" fill="#ccfbf1" font-size="14">Dikerjakan di komputer</text>
<path d="M616 177 V198 M610 191 L616 200 L622 191" fill="none" stroke="#5eead4" stroke-width="3"/>
<rect x="440" y="203" width="350" height="70" rx="12" fill="#164e63"/><text x="458" y="231" fill="#f0f9ff" font-size="19">03 / Upload → board</text><text x="458" y="254" fill="#cffafe" font-size="14">Kabel data · port yang benar</text>
<path d="M616 274 V295 M610 288 L616 297 L622 288" fill="none" stroke="#5eead4" stroke-width="3"/>
<rect x="440" y="300" width="350" height="64" rx="12" fill="#312e81"/><text x="458" y="327" fill="#eef2ff" font-size="19">04 / Serial Monitor</text><text x="458" y="350" fill="#e0e7ff" font-size="14">Baca pesan · cocokkan baud</text><text x="32" y="396" fill="#cbd5e1" font-size="14">Build ≠ upload. Board baru berubah setelah upload berhasil.</text></g></svg>
