<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" role="img" aria-labelledby="title desc"><title id="title">ESP32 menjadi publisher dan subscriber</title><desc id="desc">Mulai dari JSON simulasi agar masalah koneksi mudah dilacak.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6366a5"/></marker></defs><rect width="820" height="420" rx="24" fill="#f4f3fa"/><g font-family="Arial,sans-serif"><text x="30" y="38" font-size="21" font-weight="700" fill="#202c49">ESP32 menjadi publisher dan subscriber</text><text x="30" y="64" font-size="14" fill="#5b6379">Mulai dari JSON simulasi agar masalah koneksi mudah dilacak.</text><path d="M260 140 H292" fill="none" stroke="#6366a5" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M520 140 H552" fill="none" stroke="#6366a5" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M667 185 V247" fill="none" stroke="#6366a5" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M555 292 H523" fill="none" stroke="#6366a5" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="95" width="225" height="90" rx="14" fill="white" stroke="#c9c7dd"/><text x="50" y="119" font-size="12" font-weight="700" fill="#6366a5">01</text><text x="50" y="143" font-size="17" font-weight="700" fill="#202c49">ESP32 + Wi-Fi</text><text x="50" y="166" font-size="13" fill="#5b6379">Jangkau IP broker</text><rect x="295" y="95" width="225" height="90" rx="14" fill="white" stroke="#c9c7dd"/><text x="310" y="119" font-size="12" font-weight="700" fill="#6366a5">02</text><text x="310" y="143" font-size="17" font-weight="700" fill="#202c49">Login MQTT</text><text x="310" y="166" font-size="13" fill="#5b6379">Client ID unik + akun</text><rect x="555" y="95" width="225" height="90" rx="14" fill="white" stroke="#c9c7dd"/><text x="570" y="119" font-size="12" font-weight="700" fill="#6366a5">03</text><text x="570" y="143" font-size="17" font-weight="700" fill="#202c49">Broker MQTT</text><text x="570" y="166" font-size="13" fill="#5b6379">Terima telemetry JSON</text><rect x="555" y="247" width="225" height="90" rx="14" fill="white" stroke="#c9c7dd"/><text x="570" y="271" font-size="12" font-weight="700" fill="#6366a5">04</text><text x="570" y="295" font-size="17" font-weight="700" fill="#202c49">Terminal pemantau</text><text x="570" y="318" font-size="13" fill="#5b6379">Subscribe telemetry</text><rect x="295" y="247" width="225" height="90" rx="14" fill="white" stroke="#c9c7dd"/><text x="310" y="271" font-size="12" font-weight="700" fill="#6366a5">05</text><text x="310" y="295" font-size="17" font-weight="700" fill="#202c49">Pesan terlihat</text><text x="310" y="318" font-size="13" fill="#5b6379">Uji reconnect dan command</text><text x="30" y="371" font-size="13" fill="#5b6379">Arah balik command: viewer → broker → ESP32 → Serial Monitor</text><text x="30" y="393" font-size="13" fill="#5b6379">Tidak ada sensor atau beban listrik pada latihan ini.</text></g></svg>
