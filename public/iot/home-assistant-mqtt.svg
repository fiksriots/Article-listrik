<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" role="img" aria-labelledby="title desc"><title id="title">Home Assistant berlangganan data MQTT</title><desc id="desc">Discovery mendefinisikan sensor; telemetry memberi nilainya.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#71678f"/></marker></defs><rect width="820" height="500" rx="22" fill="#f5f3f9"/><g font-family="Arial,sans-serif"><text x="28" y="36" font-size="21" fill="#202c49" font-weight="700">Home Assistant berlangganan data MQTT</text><text x="28" y="64" font-size="13" fill="#5b6379">Discovery mendefinisikan sensor; telemetry memberi nilainya.</text><rect x="30" y="120" width="210" height="110" rx="13" fill="#fff" stroke="#cfc9dd"/><text x="44" y="148" font-size="16" fill="#202c49" font-weight="700">ESP32 / publisher</text><text x="44" y="177" font-size="12" fill="#5b6379">Telemetry JSON setiap 5 detik</text><rect x="305" y="120" width="210" height="110" rx="13" fill="#fff" stroke="#cfc9dd"/><text x="319" y="148" font-size="16" fill="#202c49" font-weight="700">Broker MQTT</text><text x="319" y="177" font-size="12" fill="#5b6379">Topic data dan konfigurasi</text><rect x="580" y="120" width="210" height="110" rx="13" fill="#fff" stroke="#cfc9dd"/><text x="594" y="148" font-size="16" fill="#202c49" font-weight="700">Home Assistant</text><text x="594" y="177" font-size="12" fill="#5b6379">Discovery + subscription</text><path d="M240 175H301" fill="none" stroke="#71678f" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M515 175H576" fill="none" stroke="#71678f" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="30" y="330" width="210" height="110" rx="13" fill="#fff" stroke="#cfc9dd"/><text x="44" y="358" font-size="16" fill="#202c49" font-weight="700">Discovery admin</text><text x="44" y="387" font-size="12" fill="#5b6379">Publish konfigurasi retained</text><rect x="580" y="330" width="210" height="110" rx="13" fill="#fff" stroke="#cfc9dd"/><text x="594" y="358" font-size="16" fill="#202c49" font-weight="700">Entity dan dashboard</text><text x="594" y="387" font-size="12" fill="#5b6379">Expire_after 20 detik</text><path d="M240 385H275V200H301" fill="none" stroke="#71678f" stroke-width="2.4" marker-end="url(#arrow)"/><text x="253" y="358" font-size="12" fill="#71678f">Config</text><path d="M685 230V326" fill="none" stroke="#71678f" stroke-width="2.4" marker-end="url(#arrow)"/><text x="28" y="470" font-size="12" fill="#5b6379">Akun ha-lab membaca data; jangan memberi izin command atau admin yang tidak diperlukan.</text></g></svg>
