<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" role="img" aria-labelledby="title desc"><title id="title">LoRaWAN: radio dan jalur jaringan</title><desc id="desc">Modul transceiver LoRa bukan gateway LoRaWAN penuh.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#71678f"/></marker></defs><rect width="820" height="500" rx="22" fill="#f5f3f9"/><g font-family="Arial,sans-serif"><text x="28" y="36" font-size="21" fill="#202c49" font-weight="700">LoRaWAN: radio dan jalur jaringan</text><text x="28" y="64" font-size="13" fill="#5b6379">Modul transceiver LoRa bukan gateway LoRaWAN penuh.</text><rect x="30" y="115" width="210" height="110" rx="13" fill="#fff" stroke="#cfc9dd"/><text x="44" y="143" font-size="16" fill="#202c49" font-weight="700">End device</text><text x="44" y="172" font-size="12" fill="#5b6379">Sensor + stack LoRaWAN</text><rect x="305" y="115" width="210" height="110" rx="13" fill="#fff" stroke="#cfc9dd"/><text x="319" y="143" font-size="16" fill="#202c49" font-weight="700">Gateway</text><text x="319" y="172" font-size="12" fill="#5b6379">Radio ↔ jaringan IP</text><rect x="580" y="115" width="210" height="110" rx="13" fill="#fff" stroke="#cfc9dd"/><text x="594" y="143" font-size="16" fill="#202c49" font-weight="700">Network server</text><text x="594" y="172" font-size="12" fill="#5b6379">Jaringan dan sesi</text><path d="M240 168H301" fill="none" stroke="#71678f" stroke-width="2.4" marker-end="url(#arrow)"/><text x="246" y="148" font-size="12" fill="#71678f">LoRa radio</text><path d="M515 168H576" fill="none" stroke="#71678f" stroke-width="2.4" marker-end="url(#arrow)"/><text x="540" y="148" font-size="12" fill="#71678f">IP</text><rect x="580" y="320" width="210" height="110" rx="13" fill="#fff" stroke="#cfc9dd"/><text x="594" y="348" font-size="16" fill="#202c49" font-weight="700">Aplikasi / decoder</text><text x="594" y="377" font-size="12" fill="#5b6379">Byte payload → suhu dan flag</text><rect x="305" y="320" width="210" height="110" rx="13" fill="#fff" stroke="#cfc9dd"/><text x="319" y="348" font-size="16" fill="#202c49" font-weight="700">Integrasi tampilan</text><text x="319" y="377" font-size="12" fill="#5b6379">MQTT/API sesuai platform</text><path d="M685 225V316" fill="none" stroke="#71678f" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M580 375H519" fill="none" stroke="#71678f" stroke-width="2.4" marker-end="url(#arrow)"/><text x="28" y="470" font-size="12" fill="#5b6379">Cocokkan perangkat, antena, dan parameter regional; decoder contoh tidak memancarkan radio.</text></g></svg>
