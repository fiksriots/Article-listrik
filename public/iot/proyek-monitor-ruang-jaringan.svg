<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" role="img" aria-labelledby="title desc"><title id="title">Pemantauan ruang perangkat jaringan</title><desc id="desc">Suhu, pintu, air simulasi, serta kesehatan jalur data dipisahkan.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#71678f"/></marker></defs><rect width="820" height="500" rx="22" fill="#f5f3f9"/><g font-family="Arial,sans-serif"><text x="28" y="36" font-size="21" fill="#202c49" font-weight="700">Pemantauan ruang perangkat jaringan</text><text x="28" y="64" font-size="13" fill="#5b6379">Suhu, pintu, air simulasi, serta kesehatan jalur data dipisahkan.</text><rect x="25" y="100" width="220" height="95" rx="13" fill="#fff" stroke="#cfc9dd"/><text x="39" y="128" font-size="16" fill="#202c49" font-weight="700">DHT22 · GPIO4</text><text x="39" y="157" font-size="12" fill="#5b6379">Suhu nyata / flag validitas</text><rect x="25" y="220" width="220" height="95" rx="13" fill="#fff" stroke="#cfc9dd"/><text x="39" y="248" font-size="16" fill="#202c49" font-weight="700">Pintu · GPIO27</text><text x="39" y="277" font-size="12" fill="#5b6379">Tombol dahulu, kontak magnet</text><text x="39" y="295" font-size="12" fill="#5b6379">kemudian</text><rect x="25" y="340" width="220" height="95" rx="13" fill="#fff" stroke="#cfc9dd"/><text x="39" y="368" font-size="16" fill="#202c49" font-weight="700">Air simulasi · GPIO26</text><text x="39" y="397" font-size="12" fill="#5b6379">Tombol kering, bukan menuang</text><text x="39" y="415" font-size="12" fill="#5b6379">air</text><rect x="320" y="180" width="210" height="150" rx="13" fill="#fff" stroke="#cfc9dd"/><text x="334" y="208" font-size="16" fill="#202c49" font-weight="700">ESP32 NOC</text><text x="334" y="237" font-size="12" fill="#5b6379">Snapshot tiap 5 detik ·</text><text x="334" y="255" font-size="12" fill="#5b6379">schema khusus NOC</text><path d="M245 147H280V255H316" fill="none" stroke="#71678f" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M245 267H280V255H316" fill="none" stroke="#71678f" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M245 387H280V255H316" fill="none" stroke="#71678f" stroke-width="2.4" marker-end="url(#arrow)"/><rect x="600" y="125" width="195" height="115" rx="13" fill="#fff" stroke="#cfc9dd"/><text x="614" y="153" font-size="16" fill="#202c49" font-weight="700">Broker MQTT</text><text x="614" y="182" font-size="12" fill="#5b6379">Telemetry + status Last</text><text x="614" y="200" font-size="12" fill="#5b6379">Will</text><rect x="600" y="330" width="195" height="105" rx="13" fill="#fff" stroke="#cfc9dd"/><text x="614" y="358" font-size="16" fill="#202c49" font-weight="700">Pengamat / aplikasi</text><text x="614" y="387" font-size="12" fill="#5b6379">Umur data dan alarm per</text><text x="614" y="405" font-size="12" fill="#5b6379">input</text><path d="M530 255H565V183H596" fill="none" stroke="#71678f" stroke-width="2.4" marker-end="url(#arrow)"/><path d="M698 240V326" fill="none" stroke="#71678f" stroke-width="2.4" marker-end="url(#arrow)"/><text x="28" y="470" font-size="12" fill="#5b6379">Prototype monitoring, bukan kontrol akses atau sistem keselamatan; input simulasi diberi label.</text></g></svg>
