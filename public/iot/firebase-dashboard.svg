ze="17" font-weight="700" fill="#202c49">Path latest</text><text x="570" y="166" font-size="13" fill="#5b6379">SDK onValue menerima data</text><rect x="555" y="247" width="225" height="90" rx="14" fill="white" stroke="#c9c7dd"/><text x="570" y="271" font-size="12" font-weight="700" fill="#6366a5">04</text><text x="570" y="295" font-size="17" font-weight="700" fill="#202c49">Tampilan suhu</text><text x="570" y="318" font-size="13" fill="#5b6379">Penanda simulasi + waktu</text><rect x="295" y="247" width="225" height="90" rx="14" fill="white" stroke="#c9c7dd"/><text x="310" y="271" font-size="12" font-weight="700" fill="#6366a5">05</text><text x="310" y="295" font-size="17" font-weight="700" fill="#202c49">Umur data</text><text x="310" y="318" font-size="13" fill="#5b6379">&gt;20 detik: label data lama</text><text x="30" y="371" font-size="13" fill="#5b6379">Browser tidak menerima password MQTT atau service-account private key.</text><text x="30" y="393" font-size="13" fill="#5b6379">Contoh hanya membaca data; tidak menerbitkan perintah ke perangkat.</text></g></svg>
