<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400"><rect width="860" height="400" rx="20" fill="#f5eee5"/><g font-family="Arial,sans-serif" fill="#302a26"><text x="40" y="50" font-size="25">Tiga area: edit, pilih, lalu catat</text><rect x="40" y="130" width="230" height="130" rx="14" fill="white" stroke="#dbcfc3"/><text x="58" y="175" font-size="22">Working tree</text><text x="58" y="210" font-size="16">File yang sedang diedit</text><rect x="315" y="130" width="230" height="130" rx="14" fill="white" stroke="#dbcfc3"/><text x="333" y="175" font-size="22">Staging / index</text><text x="333" y="210" font-size="16">Snapshot yang dipilih</text><rect x="590" y="130" width="230" height="130" rx="14" fill="white" stroke="#dbcfc3"/><text x="608" y="175" font-size="22">Repository lokal</text><text x="608" y="210" font-size="16">Riwayat commit</text><g font-size="17" fill="#a14e32"><text x="270" y="110">git add →</text><text x="535" y="110">git commit →</text></g><text x="40" y="330" font-size="18">Edit sesudah add? Isi staging tetap versi saat add terakhir.</text><text x="40" y="365" font-size="16">Commit tetap lokal. Push adalah langkah terpisah untuk berbagi ke remote.</text></g></svg>